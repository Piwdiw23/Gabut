<style>
:root{--bg:#f7f3e8;--card:#fffdf6;--tx:#1f2a24;--mu:#5d6b62;--ac:#0f6b4a;--gold:#b8892b;--ln:#e3dcc6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a15;--card:#15251d;--tx:#eae6d6;--mu:#9bab9f;--ac:#4fc496;--gold:#e0b552;--ln:#26382e}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.6;display:flex;flex-direction:column}
#bk{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;scrollbar-width:none}

.pg{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;overflow-y:auto;padding:18px 18px 28px}
.cd{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:18px;max-width:640px;margin:0 auto}
h1,h2{margin:.2em 0 .4em;color:var(--ac)}.cd::after{content:"— Selesai membaca · geser ke halaman berikutnya —";display:block;text-align:center;color:var(--mu);font-size:.8rem;margin-top:20px}h2{font-size:1.25rem}
.bd{display:inline-block;font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:99px;color:#fff;margin-bottom:8px}
.q{background:#b8892b}.r{background:#6b5b95}.s{background:#0f6b4a}.h{background:#2f6fa8}.d{background:#c2671a}.x{background:#b3362d}
.ar{font-family:"Amiri Quran","Amiri","Scheherazade New","Traditional Arabic","Noto Naskh Arabic",serif;font-size:2.1rem;line-height:2.8;text-align:right;direction:rtl;margin:14px 0;padding:10px 14px;color:var(--tx);background:rgba(15,107,74,.07);border-right:4px solid var(--gold);border-radius:10px;word-spacing:.08em;font-feature-settings:"liga","calt"}
.lt{font-style:italic;color:var(--mu)}.sm{font-size:.82rem;color:var(--mu);border-top:1px dashed var(--ln);margin-top:12px;padding-top:8px}
.nt{background:rgba(184,137,43,.12);border-left:4px solid var(--gold);padding:8px 12px;border-radius:8px;margin:10px 0;font-size:.92rem}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.fg div{text-align:center;font-size:.85rem}svg{width:100%;max-width:120px;stroke:var(--ac);fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}

<script>
var L={q:"Al-Qur’an",s:"Hadis Sahih",h:"Hadis Hasan",d:"Hadis Dhaif (lemah)",x:"Tanpa sumber sahih"};
var P=[
{j:"Al-Waqi’ah",g:"d",k:"Hadis Ibnu Mas’ud bahwa membaca Al-Waqi’ah tiap malam menjauhkan dari kefakiran dinilai lemah oleh Al-Albani dan sejumlah ulama hadis. Membacanya sebagai tilawah Al-Qur’an tetap berpahala (keutamaan membaca Al-Qur’an itu sahih), tetapi jangan diyakini sebagai jaminan anti-miskin. Doa “bihaqqi suratil waqi’ah wa asrarihaa” di draf lama tidak punya sumber hadis, jadi dihapus.",s:"Al-Baihaqi, Syu’abul Iman; Al-Albani, Silsilah Adh-Dha’ifah"},
{j:"Al-Mulk: Penutup Malam",g:"s",k:"Dari Jabir RA: Nabi SAW tidak tidur sebelum membaca Surat As-Sajdah dan Al-Mulk. Surat Al-Mulk (30 ayat) juga memberi syafaat bagi pembacanya. Ayat 15 mengajarkan ikhtiar: berjalan mencari rezeki.",a:"هُوَ الَّذِي جَعَلَ لَكُمُ الْأَرْضَ ذَلُولًا فَامْشُوا فِي مَنَاكِبِهَا وَكُلُوا مِن رِّزْقِهِ ۖ وَإِلَيْهِ النُّشُورُ",l:"Huwal-ladzii ja’ala lakumul-ardha dzaluulan famsyuu fii manaakibihaa wa kuluu mir-rizqih, wa ilaihin-nusyuur.",r:"“Dialah yang menjadikan bumi itu mudah bagi kamu, maka berjalanlah di segala penjurunya dan makanlah sebagian dari rezeki-Nya. Dan hanya kepada-Nya kamu (kembali setelah) dibangkitkan.”",s:"QS. Al-Mulk: 15; HR. Tirmidzi no. 2892; HR. Abu Dawud no. 1400. Catatan: hadis “Yasin jantung Al-Qur’an” dan khasiat khusus Yasin untuk rezeki dinilai lemah."},
{j:"Ayat Seribu Dinar",g:"q",k:"Ayatnya benar dari Al-Qur’an, dan pesannya jelas: takwa membuka jalan keluar, tawakal mencukupkan. Namun cerita “pedagang yang bermimpi Nabi Khidir lalu menjadi raja” tidak punya sanad (cerita rakyat), jadi tidak ditulis sebagai fakta. Riwayat sebab turun tentang Auf bin Malik disebut dalam kitab tafsir, tetapi sanadnya diperselisihkan.",a:"وَمَن يَتَّقِ اللَّهَ يَجْعَل لَّهُ مَخْرَجًا ﴿٢﴾ وَيَرْزُقْهُ مِنْ حَيْثُ لَا يَحْتَسِبُ ۚ وَمَن يَتَوَكَّلْ عَلَى اللَّهِ فَهُوَ حَسْبُهُ ۚ إِنَّ اللَّهَ بَالِغُ أَمْرِهِ ۚ قَدْ جَعَلَ اللَّهُ لِكُلِّ شَيْءٍ قَدْرًا ﴿٣﴾",l:"Wa may-yattaqillaaha yaj’al lahuu makhrajaa. Wa yarzuq-hu min haitsu laa yahtasib, wa may-yatawakkal ’alallaahi fahuwa hasbuh, innallaaha baalighu amrih, qad ja’alallaahu likulli syai-in qadraa.",r:"“Barang siapa bertakwa kepada Allah, niscaya Dia akan membukakan jalan keluar baginya, dan memberinya rezeki dari arah yang tidak disangka-sangkanya. Barang siapa bertawakal kepada Allah, niscaya Allah akan mencukupkan (keperluan)nya. Sesungguhnya Allah melaksanakan urusan-Nya. Sungguh, Allah telah mengadakan ketentuan bagi setiap sesuatu.”",s:"QS. At-Talaq: 2–3"},
{j:"Doa Nabi Musa AS",g:"q",k:"Musa AS tiba di Madyan dalam keadaan lapar dan tanpa bekal, menolong dua perempuan memberi minum ternak, lalu berteduh dan berdoa. Setelah itu Allah memberinya pekerjaan dan tempat bernaung (QS. Al-Qasas: 22–28). Perhatikan urutannya: ia bekerja menolong orang dulu, baru berdoa.",a:"رَبِّ إِنِّي لِمَا أَنزَلْتَ إِلَيَّ مِنْ خَيْرٍ فَقِيرٌ",l:"Rabbi innii limaa anzalta ilayya min khairin faqiir.",r:"“Ya Tuhanku, sungguh aku sangat memerlukan sesuatu kebaikan yang Engkau turunkan kepadaku.”",s:"QS. Al-Qasas: 24"},
{j:"Doa Nabi Sulaiman AS",g:"q",k:"Ayat 35 Surat Shad adalah doa Sulaiman yang diawali permohonan ampun. Cerita bahwa ia “kehilangan kerajaan karena kelalaian kecil” berasal dari riwayat Israiliyat, bukan dari Al-Qur’an atau hadis sahih, jadi tidak dipakai.",a:"رَبِّ اغْفِرْ لِي وَهَبْ لِي مُلْكًا لَّا يَنبَغِي لِأَحَدٍ مِّن بَعْدِي ۖ إِنَّكَ أَنتَ الْوَهَّابُ",l:"Rabbighfir lii wa hab lii mulkan laa yambaghii li-ahadin min ba’dii, innaka antal wahhaab.",r:"“Ya Tuhanku, ampunilah aku dan anugerahkanlah kepadaku kerajaan yang tidak dimiliki siapa pun setelahku. Sungguh, Engkaulah Yang Maha Pemberi.”",s:"QS. Shad: 35. Catatan: ini doa khusus Nabi Sulaiman; boleh dibaca, tetapi bukan janji menjadi raja."},
{j:"Tahajud & Sholat Hajat",g:"s",k:"Sahih: Allah turun ke langit dunia pada sepertiga malam terakhir dan menyeru siapa yang berdoa, meminta, dan memohon ampun (HR. Bukhari 1145, Muslim 758). Ini dalil kuat untuk berdoa di waktu tahajud.<br><br><span class='bd d'>Sholat Hajat: dhaif</span><br>Hadis Abdullah bin Abi Aufa (Tirmidzi 479, Ibnu Majah 1384) tentang tata cara sholat hajat sanadnya lemah, termasuk lafaz doa panjang di draf lama. Alternatif yang sahih: sholat istikharah (HR. Bukhari 1162) saat memilih keputusan, dan sholat sunnah dua rakaat lalu berdoa dengan bahasa sendiri di waktu mustajab.",s:"HR. Bukhari 1145; HR. Muslim 758; HR. Bukhari 1162"},
{j:"Sholat Dhuha",g:"s",k:"Rasulullah SAW berwasiat kepada Abu Hurairah untuk tidak meninggalkan dua rakaat Dhuha (HR. Bukhari 1981, Muslim 721). Ummu Hani meriwayatkan beliau sholat Dhuha delapan rakaat saat Fathu Makkah (HR. Bukhari 1176). Hadis qudsi “Wahai anak Adam, sholatlah karena-Ku empat rakaat di awal siang, Aku cukupkan engkau di akhirnya” diriwayatkan Abu Dawud 1289 dan Tirmidzi 475 (sahih menurut Al-Albani).<div class='nt'>Doa Dhuha “Allahumma innad dhuha-a dhuhaa-uka…” adalah doa susunan ulama (dinukil dalam kitab fikih Syafi’iyah), bukan hadis Nabi. Boleh dibaca sebagai doa, tetapi jangan dinisbatkan kepada Nabi SAW.</div>Waktu: sekitar 15–20 menit setelah matahari terbit sampai menjelang Zuhur. Jumlah: 2 rakaat atau lebih.",s:"HR. Bukhari 1981, 1176; HR. Muslim 721; HR. Abu Dawud 1289; HR. Tirmidzi 475"},
{j:"Istighfar Pembuka Rezeki",g:"q",k:"Nabi Nuh AS menyeru kaumnya beristighfar sebagai sebab turunnya hujan, bertambahnya harta, anak, dan kebun. Kisah Hasan Al-Bashri dan empat penanya dinukil dalam kitab tafsir, tetapi sanadnya tidak kuat sehingga dicatat sebagai riwayat saja. Hadis “siapa memperbanyak istighfar, Allah beri jalan keluar dan rezeki dari arah tak terduga” (Abu Dawud 1518) dinilai lemah, jadi dalil utamanya adalah ayat ini.",a:"فَقُلْتُ اسْتَغْفِرُوا رَبَّكُمْ إِنَّهُ كَانَ غَفَّارًا ﴿١٠﴾ يُرْسِلِ السَّمَاءَ عَلَيْكُم مِّدْرَارًا ﴿١١﴾ وَيُمْدِدْكُم بِأَمْوَالٍ وَبَنِينَ وَيَجْعَل لَّكُمْ جَنَّاتٍ وَيَجْعَل لَّكُمْ أَنْهَارًا ﴿١٢﴾",l:"Fa qultustaghfiruu rabbakum innahuu kaana ghaffaaraa. Yursilis-samaa-a ’alaikum midraaraa. Wa yumdidkum bi-amwaalin wa baniin, wa yaj’al lakum jannaatin wa yaj’al lakum anhaaraa.",r:"“Maka aku berkata, ‘Mohonlah ampunan kepada Tuhanmu, sungguh Dia Maha Pengampun, niscaya Dia menurunkan hujan yang lebat dari langit kepadamu, memperbanyak harta dan anak-anakmu, mengadakan kebun-kebun dan mengadakan sungai-sungai untukmu.’”",s:"QS. Nuh: 10–12"},
{j:"Sayyidul Istighfar",g:"s",k:"Nabi SAW bersabda: siapa membacanya dengan yakin di siang hari lalu wafat sebelum sore, ia termasuk penghuni surga; demikian pula bila dibaca di malam hari.",a:"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ",l:"Allahumma anta rabbii laa ilaaha illaa anta, khalaqtanii wa anaa ’abduka, wa anaa ’alaa ’ahdika wa wa’dika mastatha’tu, a’uudzu bika min syarri maa shana’tu, abuu-u laka bini’matika ’alayya, wa abuu-u bidzanbii faghfir lii fa-innahuu laa yaghfirudz-dzunuuba illaa anta.",r:"“Ya Allah, Engkau Tuhanku, tiada Tuhan selain Engkau. Engkau menciptakanku dan aku hamba-Mu. Aku berpegang pada perjanjian dan janji-Mu semampuku. Aku berlindung dari keburukan perbuatanku. Aku mengakui nikmat-Mu atasku dan mengakui dosaku, maka ampunilah aku, sebab tiada yang mengampuni dosa selain Engkau.”",s:"HR. Bukhari no. 6306"},
{j:"Tasbih 100x Sehari",g:"s",k:"Sahih: siapa membaca tasbih ini seratus kali dalam sehari, dosanya digugurkan walau sebanyak buih lautan. Ini yang boleh diamalkan.<div class='nt'><b>Dikoreksi:</b> “Tasbih malaikat 100x antara fajar dan Subuh yang membuat dunia datang melimpah” beserta cerita sahabat yang hartanya “bingung disimpan” tidak ditemukan sumber sahihnya, jadi dihapus. Rujukan Bukhari 6406 hanya memuat keutamaan lafaz tasbih, bukan janji kaya.</div>",a:"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ",l:"Subhaanallaahi wa bihamdih.",r:"“Maha Suci Allah dan segala puji bagi-Nya.”",s:"HR. Muslim no. 2691; HR. Bukhari no. 6405–6406"},
{j:"Doa Berkah untuk Anas bin Malik",g:"s",k:"Ummu Sulaim membawa Anas kecil kepada Nabi SAW agar didoakan. Nabi mendoakannya, dan Anas bersaksi hartanya banyak dan keturunannya lebih dari seratus orang. Doa ini milik Anas; umat boleh meniru lafaznya untuk memohon keberkahan.",a:"اللَّهُمَّ أَكْثِرْ مَالَهُ وَوَلَدَهُ، وَبَارِكْ لَهُ فِيمَا أَعْطَيْتَهُ",l:"Allahumma ak-tsir maalahuu wa waladahuu, wa baarik lahuu fiimaa a’thaitah. (Untuk diri sendiri: …maalii wa waladii, wa baarik lii fiimaa a’thaitanii.)",r:"“Ya Allah, perbanyaklah hartanya dan anaknya, serta berkahilah apa yang Engkau berikan kepadanya.”",s:"HR. Bukhari no. 6334, 6344; HR. Muslim no. 2480"},
{j:"Doa Pelunas Utang",g:"h",k:"Seorang budak mukatab mengeluh tak mampu melunasi cicilan kemerdekaannya. Ali bin Abi Thalib RA mengajarkan doa yang ia terima dari Nabi SAW, dan berkata Allah akan menolong melunasi walau utang sebesar gunung. Tirmidzi menilainya hasan gharib.",a:"اللَّهُمَّ اكْفِنِي بِحَلَالِكَ عَنْ حَرَامِكَ، وَأَغْنِنِي بِفَضْلِكَ عَمَّنْ سِوَاكَ",l:"Allahummak-finii bihalaalika ’an haraamika, wa aghninii bifadhlika ’amman siwaaka.",r:"“Ya Allah, cukupkanlah aku dengan yang halal dari-Mu sehingga terhindar dari yang haram, dan kayakanlah aku dengan karunia-Mu sehingga tidak bergantung kepada selain-Mu.”",s:"HR. Tirmidzi no. 3563; HR. Ahmad no. 1319"},
{j:"Sedekah & Silaturahmi",g:"s",k:"Hadis Abu Hurairah: setiap pagi turun dua malaikat; satu berdoa agar yang berinfak diberi ganti, satu lagi berdoa kebinasaan bagi yang kikir (HR. Bukhari 1442, Muslim 1010). Redaksinya “setiap pagi”, jadi tidak harus tepat usai Subuh. Sedekah kecil yang rutin lebih baik daripada besar yang jarang.<br><br>Silaturahmi: “Siapa ingin dilapangkan rezekinya dan dipanjangkan umurnya, hendaklah menyambung silaturahmi” (HR. Bukhari 5986, Muslim 2557).<div class='nt'>Kisah Uwais Al-Qarni (Muslim 2542) tentang bakti kepada ibu, bukan tentang kekayaan, jadi dipisahkan dari bab rezeki.</div>",a:"رَبِّ اغْفِرْ لِي وَلِوَالِدَيَّ وَارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا",l:"Rabbighfir lii wa liwaalidayya warhamhumaa kamaa rabbayaanii shaghiiraa.",r:"“Ya Tuhanku, ampunilah aku dan kedua orang tuaku, sayangilah mereka sebagaimana mereka mendidikku di waktu kecil.”",s:"QS. Al-Isra’: 24; QS. Nuh: 28; HR. Bukhari 1442, 5986; HR. Muslim 1010, 2557"}
];
var bk=document.getElementById("bk"),H="";
H+='<section class="pg"><div class="cd" style="text-align:center"><div class="ar" style="text-align:center;color:var(--gold)">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</div><h1>Kitab Amalan Pembuka Rezeki</h1><p class="lt">Geser ke kiri untuk membuka halaman berikutnya →</p><svg viewBox="0 0 100 100" style="max-width:150px;stroke:var(--gold)"><circle cx="50" cy="50" r="40"/><path d="M50 10L61 39 90 39 67 57 75 86 50 69 25 86 33 57 10 39 39 39Z"/></svg><p>Edisi awal dengan label keaslian setiap dalil</p></div></section>';
H+='<section class="pg"><div class="cd"><h2>Cara Membaca Label</h2><p><span class="bd q">Al-Qur’an</span> Firman Allah, pasti benar.</p><p><span class="bd s">Hadis Sahih</span> Sanad kuat, boleh diamalkan.</p><p><span class="bd h">Hadis Hasan</span> Cukup kuat, boleh diamalkan.</p><p><span class="bd d">Hadis Dhaif</span> Lemah; tidak dijadikan dasar janji atau keyakinan.</p><p><span class="bd x">Tanpa sumber sahih</span> Cerita atau doa tanpa rujukan, tidak dimuat sebagai fakta.</p><div class="nt"><b>Penting:</b> Islam mengajarkan Allah menjamin kecukupan rezeki hamba yang bertakwa dan berikhtiar, bukan menjanjikan “kaya raya” lewat bacaan tertentu. Amalan di sini melengkapi kerja halal, hemat, dan sedekah. Bukan pengganti ikhtiar.</div><p class="sm">Nomor hadis bisa berbeda antar cetakan kitab. Sebelum menyebarkan, cocokkan di dorar.net, hadits.id, atau tanyakan kepada ustaz/ulama setempat.</p></div></section>';
P.forEach(function(p){H+='<section class="pg"><div class="cd"><span class="bd '+p.g+'">'+L[p.g]+'</span><h2>'+p.j+'</h2><p>'+p.k+'</p>'+(p.a?'<div class="ar">'+p.a+'</div><p class="lt">'+p.l+'</p><p><b>Artinya:</b> '+p.r+'</p>':'')+'<div class="sm"><b>Sumber:</b> '+p.s+'</div></div></section>'});
var M=[["تَبَارَكَ الَّذِي بِيَدِهِ الْمُلْكُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ","Tabaarakal-ladzii biyadihil-mulku wa huwa ’alaa kulli syai-in qadiir.","Mahasuci Allah yang di tangan-Nya segala kerajaan, dan Dia Mahakuasa atas segala sesuatu."],["الَّذِي خَلَقَ الْمَوْتَ وَالْحَيَاةَ لِيَبْلُوَكُمْ أَيُّكُمْ أَحْسَنُ عَمَلًا ۚ وَهُوَ الْعَزِيزُ الْغَفُورُ","Alladzii khalaqal-mawta wal-hayaata liyabluwakum ayyukum ahsanu ’amalaa, wa huwal-’aziizul-ghafuur.","Yang menciptakan mati dan hidup untuk menguji kamu, siapa di antara kamu yang lebih baik amalnya. Dia Mahaperkasa, Maha Pengampun."],["الَّذِي خَلَقَ سَبْعَ سَمَاوَاتٍ طِبَاقًا ۖ مَّا تَرَىٰ فِي خَلْقِ الرَّحْمَٰنِ مِن تَفَاوُتٍ ۖ فَارْجِعِ الْبَصَرَ هَلْ تَرَىٰ مِن فُطُورٍ","Alladzii khalaqa sab’a samaawaatin thibaaqaa, maa taraa fii khalqir-rahmaani min tafaawut, farji’il-basara hal taraa min futhuur.","Yang menciptakan tujuh langit berlapis-lapis. Tidak akan kamu lihat sesuatu yang tidak seimbang pada ciptaan Yang Maha Pengasih. Lihatlah berulang-ulang, adakah kamu melihat sesuatu yang retak?"],["ثُمَّ ارْجِعِ الْبَصَرَ كَرَّتَيْنِ يَنقَلِبْ إِلَيْكَ الْبَصَرُ خَاسِئًا وَهُوَ حَسِيرٌ","Tsummarji’il-basara karratayni yanqalib ilaikal-basaru khaasi-an wa huwa hasiir.","Kemudian ulangi pandangan sekali lagi, niscaya pandanganmu kembali kepadamu dengan tidak menemukan cacat dan dalam keadaan letih."],["وَلَقَدْ زَيَّنَّا السَّمَاءَ الدُّنْيَا بِمَصَابِيحَ وَجَعَلْنَاهَا رُجُومًا لِّلشَّيَاطِينِ ۖ وَأَعْتَدْنَا لَهُمْ عَذَابَ السَّعِيرِ","Wa laqad zayyannas-samaa-ad-dunyaa bimashaabiiha wa ja’alnaahaa rujuumal lisy-syayaathiin, wa a’tadnaa lahum ’adzaabas-sa’iir.","Sungguh, Kami telah menghiasi langit dunia dengan bintang-bintang, Kami jadikan itu sebagai alat pelempar setan, dan Kami sediakan bagi mereka azab neraka yang menyala-nyala."],["وَلِلَّذِينَ كَفَرُوا بِرَبِّهِمْ عَذَابُ جَهَنَّمَ ۖ وَبِئْسَ الْمَصِيرُ","Wa lilladziina kafaruu birabbihim ’adzaabu jahannam, wa bi’sal-mashiir.","Bagi orang-orang yang kafir kepada Tuhannya ada azab Jahanam. Itulah seburuk-buruk tempat kembali."],["إِذَا أُلْقُوا فِيهَا سَمِعُوا لَهَا شَهِيقًا وَهِيَ تَفُورُ","Idzaa ulquu fiihaa sami’uu lahaa syahiiqan wa hiya tafuur.","Apabila mereka dilemparkan ke dalamnya, mereka mendengar suara neraka yang mengerikan, sedang ia mendidih."],["تَكَادُ تَمَيَّزُ مِنَ الْغَيْظِ ۖ كُلَّمَا أُلْقِيَ فِيهَا فَوْجٌ سَأَلَهُمْ خَزَنَتُهَا أَلَمْ يَأْتِكُمْ نَذِيرٌ","Takaadu tamayyazu minal-ghaizh, kullamaa ulqiya fiihaa fawjun sa-alahum khazanatuhaa alam ya’tikum nadziir.","Hampir saja ia terpecah-pecah karena marah. Setiap kali segolongan dilemparkan ke dalamnya, penjaganya bertanya, “Apakah belum pernah datang kepada kamu seorang pemberi peringatan?”"],["قَالُوا بَلَىٰ قَدْ جَاءَنَا نَذِيرٌ فَكَذَّبْنَا وَقُلْنَا مَا نَزَّلَ اللَّهُ مِن شَيْءٍ إِنْ أَنتُمْ إِلَّا فِي ضَلَالٍ كَبِيرٍ","Qaaluu balaa qad jaa-anaa nadziirun fakadzdzabnaa wa qulnaa maa nazzalallaahu min syai-in in antum illaa fii dhalaalin kabiir.","Mereka menjawab, “Benar, sungguh telah datang kepada kami seorang pemberi peringatan, tetapi kami mendustakannya dan berkata, ‘Allah tidak menurunkan sesuatu apa pun; kamu hanyalah dalam kesesatan yang besar.’”"],["وَقَالُوا لَوْ كُنَّا نَسْمَعُ أَوْ نَعْقِلُ مَا كُنَّا فِي أَصْحَابِ السَّعِيرِ","Wa qaaluu law kunnaa nasma’u aw na’qilu maa kunnaa fii ash-haabis-sa’iir.","Mereka berkata, “Sekiranya kami mendengarkan atau memikirkan (peringatan itu), tentulah kami tidak termasuk penghuni neraka yang menyala-nyala.”"],["فَاعْتَرَفُوا بِذَنبِهِمْ فَسُحْقًا لِّأَصْحَابِ السَّعِيرِ","Fa’taraafuu bidzanbihim fasuhqan li-ash-haabis-sa’iir.","Maka mereka mengakui dosanya. Jauhlah (dari rahmat Allah) penghuni neraka yang menyala-nyala itu."],["إِنَّ الَّذِينَ يَخْشَوْنَ رَبَّهُم بِالْغَيْبِ لَهُم مَّغْفِرَةٌ وَأَجْرٌ كَبِيرٌ","Innal-ladziina yakhsyawna rabbahum bil-ghaibi lahum maghfiratun wa ajrun kabiir.","Sungguh, orang-orang yang takut kepada Tuhannya yang tidak terlihat, mereka memperoleh ampunan dan pahala yang besar."],["وَأَسِرُّوا قَوْلَكُمْ أَوِ اجْهَرُوا بِهِ ۖ إِنَّهُ عَلِيمٌ بِذَاتِ الصُّدُورِ","Wa asirruu qawlakum awijharuu bih, innahuu ’aliimun bidzaatish-shuduur.","Rahasiakanlah perkataanmu atau lahirkanlah; sungguh Dia Maha Mengetahui segala isi hati."],["أَلَا يَعْلَمُ مَنْ خَلَقَ وَهُوَ اللَّطِيفُ الْخَبِيرُ","Alaa ya’lamu man khalaq, wa huwal-lathiiful-khabiir.","Apakah (Allah) yang menciptakan itu tidak mengetahui? Dia Mahahalus, Maha Teliti."],["هُوَ الَّذِي جَعَلَ لَكُمُ الْأَرْضَ ذَلُولًا فَامْشُوا فِي مَنَاكِبِهَا وَكُلُوا مِن رِّزْقِهِ ۖ وَإِلَيْهِ النُّشُورُ","Huwal-ladzii ja’ala lakumul-ardha dzaluulan famsyuu fii manaakibihaa wa kuluu mir-rizqih, wa ilaihin-nusyuur.","Dialah yang menjadikan bumi itu mudah bagi kamu, maka berjalanlah di segala penjurunya dan makanlah sebagian dari rezeki-Nya. Dan hanya kepada-Nya kamu (kembali setelah) dibangkitkan."],["أَأَمِنتُم مَّن فِي السَّمَاءِ أَن يَخْسِفَ بِكُمُ الْأَرْضَ فَإِذَا هِيَ تَمُورُ","A-amintum man fis-samaa-i ay yakhsifa bikumul-ardha fa-idzaa hiya tamuur.","Apakah kamu merasa aman terhadap Allah yang di langit bahwa Dia akan membuat bumi terbelah bersama kamu, sehingga tiba-tiba ia berguncang?"],["أَمْ أَمِنتُم مَّن فِي السَّمَاءِ أَن يُرْسِلَ عَلَيْكُمْ حَاصِبًا ۖ فَسَتَعْلَمُونَ كَيْفَ نَذِيرِ","Am amintum man fis-samaa-i ay yursila ’alaikum haashibaa, fasata’lamuuna kaifa nadziir.","Atau apakah kamu merasa aman terhadap Allah yang di langit bahwa Dia akan mengirimkan badai batu kepadamu? Kelak kamu akan tahu bagaimana peringatan-Ku."],["وَلَقَدْ كَذَّبَ الَّذِينَ مِن قَبْلِهِمْ فَكَيْفَ كَانَ نَكِيرِ","Wa laqad kadzdzabal-ladziina min qablihim fakaifa kaana nakiir.","Sungguh, orang-orang sebelum mereka telah mendustakan (rasul); maka betapa hebat kemurkaan-Ku."],["أَوَلَمْ يَرَوْا إِلَى الطَّيْرِ فَوْقَهُمْ صَافَّاتٍ وَيَقْبِضْنَ ۚ مَا يُمْسِكُهُنَّ إِلَّا الرَّحْمَٰنُ ۚ إِنَّهُ بِكُلِّ شَيْءٍ بَصِيرٌ","Awalam yaraw ilath-thairi fawqahum shaaffaatin wa yaqbidhn, maa yumsikuhunna illar-rahmaan, innahuu bikulli syai-in bashiir.","Tidakkah mereka memperhatikan burung-burung di atas mereka yang mengembangkan dan mengatupkan sayapnya? Tidak ada yang menahannya (di udara) selain Yang Maha Pengasih. Sungguh, Dia Maha Melihat segala sesuatu."],["أَمَّنْ هَٰذَا الَّذِي هُوَ جُندٌ لَّكُمْ يَنصُرُكُم مِّن دُونِ الرَّحْمَٰنِ ۚ إِنِ الْكَافِرُونَ إِلَّا فِي غُرُورٍ","Amman haadzal-ladzii huwa jundun lakum yanshurukum min duunir-rahmaan, inil-kaafiruuna illaa fii ghuruur.","Siapakah yang menjadi bala tentara bagimu yang dapat menolongmu selain Allah Yang Maha Pengasih? Orang-orang kafir itu hanyalah dalam (keadaan) tertipu."],["أَمَّنْ هَٰذَا الَّذِي يَرْزُقُكُمْ إِنْ أَمْسَكَ رِزْقَهُ ۚ بَل لَّجُّوا فِي عُتُوٍّ وَنُفُورٍ","Amman haadzal-ladzii yarzuqukum in amsaka rizqah, bal lajjuu fii ’utuwwin wa nufuur.","Siapakah yang dapat memberimu rezeki jika Dia menahan rezeki-Nya? Bahkan mereka terus-menerus dalam kesombongan dan menjauh (dari kebenaran)."],["أَفَمَن يَمْشِي مُكِبًّا عَلَىٰ وَجْهِهِ أَهْدَىٰ أَمَّن يَمْشِي سَوِيًّا عَلَىٰ صِرَاطٍ مُّسْتَقِيمٍ","Afaman yamsyii mukibban ’alaa wajhihii ahdaa amman yamsyii sawiyyan ’alaa shiraathim mustaqiim.","Apakah orang yang berjalan terjungkal di atas mukanya itu lebih terpimpin, ataukah orang yang berjalan tegap di atas jalan yang lurus?"],["قُلْ هُوَ الَّذِي أَنشَأَكُمْ وَجَعَلَ لَكُمُ السَّمْعَ وَالْأَبْصَارَ وَالْأَفْئِدَةَ ۖ قَلِيلًا مَّا تَشْكُرُونَ","Qul huwal-ladzii ansya-akum wa ja’ala lakumus-sam’a wal-abshaara wal-af-idah, qaliilam maa tasykuruun.","Katakanlah, “Dialah yang menciptakan kamu dan menjadikan pendengaran, penglihatan, dan hati nurani bagimu. (Tetapi) sedikit sekali kamu bersyukur.”"],["قُلْ هُوَ الَّذِي ذَرَأَكُمْ فِي الْأَرْضِ وَإِلَيْهِ تُحْشَرُونَ","Qul huwal-ladzii dzara-akum fil-ardhi wa ilaihi tuhsyaruun.","Katakanlah, “Dialah yang menjadikan kamu berkembang biak di bumi, dan kepada-Nya kamu akan dikumpulkan.”"],["وَيَقُولُونَ مَتَىٰ هَٰذَا الْوَعْدُ إِن كُنتُمْ صَادِقِينَ","Wa yaquuluuna mataa haadzal-wa’du in kuntum shaadiqiin.","Mereka berkata, “Kapankah janji itu (datang) jika kamu orang yang benar?”"],["قُلْ إِنَّمَا الْعِلْمُ عِندَ اللَّهِ وَإِنَّمَا أَنَا نَذِيرٌ مُّبِينٌ","Qul innamal-’ilmu ’indallaah, wa innamaa ana nadziirum mubiin.","Katakanlah, “Sesungguhnya ilmu (tentang hari itu) hanya pada Allah, dan aku hanyalah seorang pemberi peringatan yang jelas.”"],["فَلَمَّا رَأَوْهُ زُلْفَةً سِيئَتْ وُجُوهُ الَّذِينَ كَفَرُوا وَقِيلَ هَٰذَا الَّذِي كُنتُم بِهِ تَدَّعُونَ","Falammaa ra-awhu zulfatan sii-at wujuuhul-ladziina kafaruu wa qiila haadzal-ladzii kuntum bihii tadda’uun.","Ketika mereka melihat (azab) itu sudah dekat, muramlah wajah orang-orang kafir, dan dikatakan (kepada mereka), “Inilah (azab) yang dahulu kamu minta.”"],["قُلْ أَرَأَيْتُمْ إِنْ أَهْلَكَنِيَ اللَّهُ وَمَن مَّعِيَ أَوْ رَحِمَنَا فَمَن يُجِيرُ الْكَافِرِينَ مِنْ عَذَابٍ أَلِيمٍ","Qul ara-aytum in ahlakaniyallaahu wa mam ma’iya aw rahimanaa faman yujiirul-kaafiriina min ’adzaabin aliim.","Katakanlah, “Terangkanlah kepadaku, jika Allah membinasakan aku dan orang-orang yang bersamaku, atau memberi rahmat kepada kami, maka siapa yang dapat melindungi orang-orang kafir dari azab yang pedih?”"],["قُلْ هُوَ الرَّحْمَٰنُ آمَنَّا بِهِ وَعَلَيْهِ تَوَكَّلْنَا ۖ فَسَتَعْلَمُونَ مَنْ هُوَ فِي ضَلَالٍ مُّبِينٍ","Qul huwar-rahmaanu aamannaa bihii wa ’alaihi tawakkalnaa, fasata’lamuuna man huwa fii dhalaalim mubiin.","Katakanlah, “Dialah Yang Maha Pengasih, kami beriman kepada-Nya dan kepada-Nya kami bertawakal. Kelak kamu akan tahu siapa yang berada dalam kesesatan yang nyata.”"],["قُلْ أَرَأَيْتُمْ إِنْ أَصْبَحَ مَاؤُكُمْ غَوْرًا فَمَن يَأْتِيكُم بِمَاءٍ مَّعِينٍ","Qul ara-aytum in ashbaha maa-ukum ghawran faman ya-tiikum bimaa-im ma’iin.","Katakanlah, “Terangkanlah kepadaku, jika sumber air kamu menjadi kering, maka siapa yang akan memberimu air yang mengalir?”"]];
[[0,10,"1–10"],[10,20,"11–20"],[20,30,"21–30"]].forEach(function(r){H+='<section class="pg"><div class="cd"><span class="bd q">Al-Qur’an</span><h2>Surat Al-Mulk ayat '+r[2]+'</h2>'+(r[0]==0?'<div class="nt">Surat ke-67, 30 ayat. Sahih: Nabi SAW membacanya sebelum tidur (HR. Tirmidzi 2892) dan surat ini memberi syafaat bagi pembacanya (HR. Abu Dawud 1400). Ayat 15 dan 21 berbicara langsung tentang rezeki.</div>':'')+M.slice(r[0],r[1]).map(function(v,i){return '<div style="border-top:1px solid var(--ln);margin-top:10px;padding-top:6px"><b style="color:var(--gold)">Ayat '+(r[0]+i+1)+'</b><div class="ar">'+v[0]+'</div><p class="lt">'+v[1]+'</p><p>'+v[2]+'</p></div>'}).join('')+'</div></section>'});
var K=[["Abdurrahman bin Auf: Kaya dari Pasar","s","Setelah hijrah ke Madinah tanpa harta, Abdurrahman dipersaudarakan dengan Sa’ad bin Ar-Rabi’. Sa’ad menawarkan separuh hartanya, tetapi Abdurrahman menjawab: “Semoga Allah memberkahi keluarga dan hartamu; tunjukkan saja aku di mana pasar.” Ia berdagang (keju dan samin), tidak lama kemudian memperoleh keuntungan, dan Nabi SAW mendoakan keberkahan pernikahannya. Kelak ia menjadi salah satu sahabat terkaya dan sangat dermawan. Pelajaran: ia meminta jalan bekerja, bukan harta cuma-cuma, dan kekayaannya disalurkan untuk sedekah.","HR. Bukhari no. 2048, 3780","دُلُّونِي عَلَى السُّوقِ","Dulluunii ’alas-suuq.","“Tunjukkan aku jalan menuju pasar.”"],["Tiga Orang di Dalam Gua","s","Tiga orang terkurung batu besar di gua, lalu masing-masing bertawassul dengan amal saleh. Salah satunya pernah mempekerjakan buruh. Upah buruh yang pergi tanpa mengambil haknya ia putar menjadi sapi, kambing, dan budak, lalu ia serahkan semuanya saat buruh itu datang. Allah membukakan batu itu. Pelajaran: amanah dalam harta dan kejujuran dalam muamalah mendatangkan pertolongan, dan rezeki halal bisa tumbuh dari amanah.","HR. Bukhari no. 2272; HR. Muslim no. 2743"],["Rezeki Seperti Burung","h","Nabi SAW bersabda: “Seandainya kalian benar-benar bertawakal kepada Allah, niscaya Dia memberi kalian rezeki sebagaimana burung: pergi pagi dalam keadaan lapar dan pulang sore dalam keadaan kenyang.” Perhatikan: burung itu pergi mencari, tidak diam di sarang. Tawakal berjalan bersama ikhtiar. Hadis lain: “Tidak akan mati satu jiwa sebelum sempurna rezekinya; maka bertakwalah dan carilah dengan cara yang baik.”","HR. Tirmidzi no. 2344; HR. Ibnu Majah no. 2144"],["Qarun: Kaya Tanpa Syukur","q","Qarun memiliki harta yang kunci-kunci gudangnya saja berat dipikul sekelompok orang kuat. Kaumnya menasihati: jangan sombong, carilah akhirat dengan hartamu dan jangan lupa bagianmu di dunia. Qarun menjawab bahwa hartanya karena ilmunya sendiri, lalu Allah membenamkan dia beserta hartanya ke dalam bumi. Pelajaran: kekayaan tanpa syukur dan tanpa berbagi bisa menjadi azab, bukan nikmat.","QS. Al-Qasas: 76–82","وَلَا تَنسَ نَصِيبَكَ مِنَ الدُّنْيَا ۖ وَأَحْسِن كَمَا أَحْسَنَ اللَّهُ إِلَيْكَ","Wa laa tansa nashiibaka minad-dunyaa wa ahsin kamaa ahsanallaahu ilaik.","“Janganlah kamu lupakan bagianmu di dunia, dan berbuat baiklah (kepada orang lain) sebagaimana Allah berbuat baik kepadamu.” (QS. Al-Qasas: 77)"]];
var S=[['Abdurrahman bin Auf: Kaya dari Pasar','s','Abdurrahman bin Auf termasuk sahabat yang hijrah ke Madinah tanpa membawa harta. Nabi SAW mempersaudarakannya dengan Sa’ad bin Ar-Rabi’ dari kaum Anshar, seorang yang kaya. Sa’ad menawarkan, “Aku orang Anshar yang paling banyak hartanya. Ambillah separuh hartaku, dan aku punya dua istri, pilihlah mana yang engkau suka, akan kuceraikan agar engkau menikahinya.”<br><br>Abdurrahman menolak dengan santun: “Semoga Allah memberkahimu pada keluarga dan hartamu. Tunjukkan saja aku pasar.” Ia pergi ke pasar, berjualan dan membeli, dan beberapa hari kemudian pulang membawa keuntungan berupa keju dan samin. Tak lama, Nabi SAW melihat bekas wewangian kuning di pakaiannya. Ia menjawab bahwa ia telah menikah dengan mahar sebesar biji emas. Nabi mendoakan keberkahan dan menganjurkan walimah, walau hanya dengan seekor kambing.<br><br>Dari seorang pendatang yang tidak punya apa-apa, ia kelak menjadi saudagar kaya yang banyak bersedekah. Pelajaran: ia tidak mengharap pemberian, ia meminta ditunjukkan jalan bekerja; modalnya adalah kejujuran, bukan wirid khusus.','HR. Bukhari no. 2048, 3780, 3781','دُلُّونِي عَلَى السُّوقِ','Dulluunii ’alas-suuq.','“Tunjukkan aku jalan menuju pasar.”'],['Nabi Musa AS di Madyan','q','Musa AS meninggalkan Mesir dalam ketakutan setelah tanpa sengaja membunuh seorang laki-laki dari pihak Fir’aun (QS. Al-Qasas: 15–21). Ia berjalan menuju Madyan tanpa bekal dan tanpa tahu jalan, hanya berserah kepada Allah. Di dekat sumur ia melihat para penggembala berebut air, sementara dua perempuan menahan kambing mereka karena tidak mampu bersaing. Tanpa diminta, Musa memberi minum ternak mereka, lalu berteduh dan berdoa: “Ya Tuhanku, sungguh aku sangat memerlukan kebaikan yang Engkau turunkan kepadaku.”<br><br>Tak lama, salah satu dari dua perempuan itu datang, berjalan dengan malu-malu, mengundangnya menemui ayahnya yang hendak membalas jasanya. Sang ayah menawarkan menikahkan Musa dengan salah satu putrinya dengan syarat Musa bekerja delapan tahun, dan boleh digenapkan sepuluh tahun. Musa menerima. Putri itu berkata kepada ayahnya: pekerja terbaik adalah yang kuat dan dapat dipercaya.<br><br>Catatan: Al-Qur’an tidak menyebut nama sang ayah. Sebagian ulama menyebut Syu’aib AS, sebagian menolak karena tidak ada dalil sahih yang tegas; jadi aman ditulis “seorang tua yang saleh di Madyan”. Pelajaran: Musa menolong dulu, bekerja jujur, lalu berdoa, dan Allah menjawab dengan pekerjaan, tempat tinggal, dan keluarga.','QS. Al-Qasas: 15–28','يَا أَبَتِ اسْتَأْجِرْهُ ۖ إِنَّ خَيْرَ مَنِ اسْتَأْجَرْتَ الْقَوِيُّ الْأَمِينُ','Yaa abatis-ta’jirhu, inna khaira manis-ta’jartal-qawiyyul-amiin.','“Wahai ayahku, ambillah dia sebagai pekerja. Sungguh, orang yang paling baik yang engkau ambil sebagai pekerja adalah yang kuat dan dapat dipercaya.” (QS. Al-Qasas: 26)'],['Nabi Yusuf AS: Menyimpan di Masa Lapang','q','Raja Mesir bermimpi tujuh sapi gemuk dimakan tujuh sapi kurus, serta tujuh bulir hijau dan tujuh bulir kering. Para pembesar tak mampu menafsirkannya. Yusuf, yang saat itu masih di penjara, menafsirkan: akan datang tujuh tahun masa subur, kemudian tujuh tahun paceklik. Sarannya jelas: tanamlah dengan sungguh-sungguh, biarkan hasilnya di tangkainya, dan ambil sedikit saja untuk dimakan; sisanya disimpan untuk masa sulit (QS. Yusuf: 47–49).<br><br>Setelah kebersihan dan kejujuran Yusuf terbukti, raja mengangkatnya sebagai orang kepercayaan. Yusuf kemudian meminta jabatan pengelola gudang pangan negeri itu, dengan alasan ia mampu menjaga dan berpengetahuan. Ketika paceklik melanda, negeri-negeri sekitar datang membeli bahan makanan ke Mesir, termasuk saudara-saudara Yusuf.<br><br>Pelajaran: rezeki juga soal perencanaan. Menabung dan mengelola saat lapang adalah bagian dari tawakal, bukan bertentangan dengannya.','QS. Yusuf: 43–57','قَالَ اجْعَلْنِي عَلَىٰ خَزَائِنِ الْأَرْضِ ۖ إِنِّي حَفِيظٌ عَلِيمٌ','Qaalaj’alnii ’alaa khazaa-inil-ardh, innii hafiizhun ’aliim.','“Jadikanlah aku bendahara negeri (Mesir), sungguh aku adalah orang yang pandai menjaga lagi berpengetahuan.” (QS. Yusuf: 55)'],['Nabi Ayyub AS: Sabar Setelah Hilang Segalanya','s','Allah memuji Ayyub sebagai hamba yang sangat sabar dan selalu kembali kepada-Nya (QS. Shad: 44). Ia diuji dengan penyakit dan hilangnya nikmat, tetapi tidak berputus asa. Doanya singkat dan tanpa keluhan kasar: ia hanya menyebut kesulitannya lalu memuji kasih sayang Allah. Allah mengabulkan, menyembuhkannya, dan mengembalikan keluarganya beserta yang semisal bersama mereka sebagai rahmat dari-Nya (QS. Al-Anbiya’: 83–84).<br><br>Dalam hadis sahih, Nabi SAW menceritakan: ketika Ayyub mandi, hujan belalang emas jatuh di dekatnya, dan ia mulai menciduknya ke bajunya. Tuhannya menyeru, “Wahai Ayyub, bukankah Aku telah mencukupkanmu dari apa yang kau lihat?” Ia menjawab, “Benar, ya Rabb, tetapi aku tidak pernah merasa cukup dari berkah-Mu.”<br><br>Pelajaran: sabar saat sempit, dan sadar bahwa yang dicari bukan sekadar harta, melainkan berkah. Rincian lain tentang lamanya sakit berasal dari kisah Israiliyat dan tidak dipakai.','QS. Al-Anbiya’: 83–84; QS. Shad: 41–44; HR. Bukhari no. 279','أَنِّي مَسَّنِيَ الضُّرُّ وَأَنتَ أَرْحَمُ الرَّاحِمِينَ','Annii massaniyadh-dhurru wa anta arhamur-raahimiin.','“(Ya Tuhanku), sungguh aku telah ditimpa penyakit, dan Engkaulah Yang Maha Penyayang di antara semua penyayang.” (QS. Al-Anbiya’: 83)'],['Maryam dan Rezeki dari Allah','q','Maryam dibesarkan dalam asuhan Nabi Zakariya AS dan tinggal beribadah di mihrab. Setiap kali Zakariya masuk menemuinya, ia mendapati makanan di sisi Maryam. “Wahai Maryam, dari mana engkau memperoleh ini?” Maryam menjawab, “Itu dari sisi Allah. Sungguh, Allah memberi rezeki kepada siapa yang Dia kehendaki tanpa batas.” Melihat kedekatan itu, Zakariya yang sudah tua pun berdoa memohon keturunan yang baik di tempat itu juga (QS. Ali Imran: 37–38). Pelajaran: ibadah dan kepercayaan penuh kepada Allah membuat hati tenang, dan rezeki bisa datang dari jalan yang tidak disangka.','QS. Ali Imran: 37–38','إِنَّ اللَّهَ يَرْزُقُ مَن يَشَاءُ بِغَيْرِ حِسَابٍ','Innallaaha yarzuqu may-yasyaa-u bighairi hisaab.','“Sungguh, Allah memberi rezeki kepada siapa yang Dia kehendaki tanpa perhitungan.”'],['Tiga Orang di Dalam Gua','s','Nabi SAW menceritakan tiga orang bepergian lalu terpaksa berlindung di sebuah gua. Sebuah batu besar jatuh menutup mulut gua dan mereka tak sanggup menggesernya. Mereka sepakat berdoa dengan menyebut amal saleh terbaik mereka masing-masing.<br><br>Pertama, seorang yang tiap malam menunggu kedua orang tuanya terbangun untuk memberi minum susu lebih dulu, dan tak mau mendahulukan keluarganya. Kedua, seorang yang hampir berzina dengan sepupu yang ia cintai, namun berhenti karena takut kepada Allah dan melepas harta yang telah ia berikan. Ketiga, seorang majikan yang mempekerjakan buruh dengan upah beberapa takar beras. Si buruh pergi tanpa mengambilnya, lalu majikan menanam beras itu sampai berkembang menjadi sapi dan penggembalanya. Bertahun-tahun kemudian si buruh datang menagih, dan majikan menyerahkan semuanya, bukan hanya haknya.<br><br>Setiap doa menggeser batu sedikit, hingga gua terbuka. Pelajaran: bakti kepada orang tua, menjaga kehormatan, dan amanah dalam harta adalah kunci keluar dari kesulitan.','HR. Bukhari no. 2272; HR. Muslim no. 2743'],['Rezeki Seperti Burung','h','Umar bin Khattab RA meriwayatkan sabda Nabi SAW: “Seandainya kalian bertawakal kepada Allah dengan sebenar-benarnya tawakal, niscaya Dia memberi kalian rezeki sebagaimana burung diberi rezeki: pagi hari pergi dalam keadaan lapar dan sore hari pulang dalam keadaan kenyang.”<br><br>Perhatikan kata kerjanya: burung itu pergi. Ia tidak diam menunggu makanan jatuh ke sarang. Allah menjamin rezeki semua makhluk (QS. Hud: 6), tetapi jaminan itu datang melalui usaha yang halal. Hadis lain menyebut bahwa tidak ada jiwa yang akan wafat sebelum rezekinya sempurna, maka bertakwalah dan carilah dengan cara yang baik.','HR. Tirmidzi no. 2344; HR. Ibnu Majah no. 2144; QS. Hud: 6','وَمَا مِن دَابَّةٍ فِي الْأَرْضِ إِلَّا عَلَى اللَّهِ رِزْقُهَا','Wa maa min daabbatin fil-ardhi illaa ’alallaahi rizquhaa.','“Dan tidak ada satu binatang melata pun di bumi melainkan Allah-lah yang memberi rezekinya.” (QS. Hud: 6)'],['Qarun: Kaya Tanpa Syukur','q','Qarun berasal dari kaum Musa. Allah memberinya harta yang kunci-kunci gudangnya saja berat dipikul sekelompok orang kuat. Kaumnya menasihati: jangan sombong, carilah kehidupan akhirat dengan apa yang Allah berikan, dan jangan lupakan bagianmu di dunia. Qarun menjawab bahwa ia mendapat harta karena ilmu yang ada padanya, seakan lupa bahwa Allah telah membinasakan banyak umat sebelumnya yang lebih kuat dan lebih kaya.<br><br>Suatu hari ia keluar dengan kemegahan di hadapan kaumnya. Orang yang menginginkan dunia berkata, “Andai kami punya seperti yang diberikan kepada Qarun.” Orang berilmu menegur, “Celaka kalian! Pahala Allah lebih baik bagi orang beriman dan beramal saleh.” Lalu Allah membenamkan Qarun beserta rumahnya ke dalam bumi, dan tak ada yang dapat menolongnya. Orang yang tadi iri berkata, “Seandainya Allah tidak melimpahkan karunia-Nya kepada kami, tentu kami pun dibenamkan.”<br><br>Pelajaran: harta bukan ukuran kemuliaan. Kaya tanpa syukur dan tanpa berbagi justru bisa menjadi azab.','QS. Al-Qasas: 76–82','وَلَا تَنسَ نَصِيبَكَ مِنَ الدُّنْيَا ۖ وَأَحْسِن كَمَا أَحْسَنَ اللَّهُ إِلَيْكَ','Wa laa tansa nashiibaka minad-dunyaa wa ahsin kamaa ahsanallaahu ilaik.','“Janganlah kamu lupakan bagianmu di dunia, dan berbuat baiklah (kepada orang lain) sebagaimana Allah berbuat baik kepadamu.” (QS. Al-Qasas: 77)'],['Pemilik Dua Kebun dan Ashabul Jannah','q','Surat Al-Kahfi menceritakan dua laki-laki. Salah satunya memiliki dua kebun anggur yang dikelilingi pohon kurma dengan ladang di tengahnya, dan sungai mengalir di antaranya. Ia membanggakan hartanya kepada temannya, mengira kebunnya tak akan binasa dan hari kiamat tidak akan datang. Temannya yang miskin mengingatkan, mengapa ia tidak mengucapkan kalimat syukur ketika memasuki kebunnya. Tak lama, kebun itu dibinasakan; ia membolak-balikkan kedua telapak tangannya menyesali apa yang telah ia keluarkan, sementara tak ada yang dapat menolongnya selain Allah.<br><br>Dalam Surat Al-Qalam, Allah menceritakan para pemilik kebun yang bersumpah akan memetik hasilnya di pagi hari agar orang miskin tidak ikut menikmati, tanpa mengucap insya Allah. Pada malam hari kebun mereka ditimpa bencana. Pagi harinya mereka sadar dan bertobat, memohon ganti yang lebih baik (QS. Al-Qalam: 17–33). Pelajaran: kikir dan takabur menghilangkan berkah.','QS. Al-Kahfi: 32–44; QS. Al-Qalam: 17–33','مَا شَاءَ اللَّهُ لَا قُوَّةَ إِلَّا بِاللَّهِ','Maa syaa-allaahu laa quwwata illaa billaah.','“Sungguh, atas kehendak Allah (semua ini terwujud); tidak ada kekuatan kecuali dengan pertolongan Allah.” (QS. Al-Kahfi: 39)'],['Tiga Orang Bani Israil: Belang, Botak, dan Buta','s','Nabi SAW menceritakan tiga orang Bani Israil yang diuji: penderita belang kulit, botak, dan buta. Allah mengutus malaikat berwujud manusia. Kepada si belang ia bertanya apa yang paling ia inginkan; ia ingin kulit bagus dan diberi unta. Si botak ingin rambut indah dan diberi sapi. Si buta ingin penglihatan dan diberi kambing. Mereka sembuh dan ternaknya beranak-pinak hingga memenuhi lembah.<br><br>Kemudian malaikat datang lagi, menyamar sebagai orang miskin yang kehabisan bekal. Si belang dan si botak berkata, “Hartaku ini warisan dari leluhur,” dan menolak membantu, lalu kembali seperti semula. Si buta berkata, “Aku dulu buta lalu Allah mengembalikan penglihatanku. Ambillah sesukamu; demi Allah aku tak keberatan atas apa pun yang engkau ambil karena Allah.” Malaikat berkata, “Tahanlah hartamu. Kalian hanya diuji: Allah ridha kepadamu dan murka kepada dua temanmu.”<br><br>Pelajaran: harta adalah ujian syukur, dan mengaku bahwa semuanya karunia Allah menjaga nikmat.','HR. Bukhari no. 3464; HR. Muslim no. 2964'],['Utang Seribu Dinar dan Kayu di Lautan','s','Nabi SAW menceritakan seorang Bani Israil yang meminta pinjaman seribu dinar. Pemberi pinjaman meminta saksi, dijawab, “Cukuplah Allah sebagai saksi.” Ia meminta penjamin, dijawab, “Cukuplah Allah sebagai penjamin.” Pemberi pinjaman pun menyetujui dan menyerahkan uangnya.<br><br>Peminjam menyeberangi laut dan berusaha keras memperoleh kapal untuk membayar tepat waktu, tetapi tidak mendapatkannya. Ia mengambil sebatang kayu, melubanginya, memasukkan seribu dinar beserta surat, menutupnya rapat, lalu membawanya ke laut sambil berdoa bahwa ia telah berusaha mencari kapal namun gagal, dan ia titipkan kepada Allah. Ia melemparkan kayu itu ke laut.<br><br>Pemberi pinjaman yang menunggu kapal kebetulan menemukan kayu itu dan membawanya pulang untuk kayu bakar. Saat dibelah, ia menemukan uang dan surat. Tak lama peminjam datang membawa seribu dinar lagi dan meminta maaf karena tak mendapat kapal lebih awal. Pemberi pinjaman berkata bahwa Allah telah menunaikan atas namanya.<br><br>Pelajaran: berusaha melunasi utang dengan sungguh-sungguh, jujur, dan menyerahkan hasilnya kepada Allah.','HR. Bukhari no. 2291'],['Abu Thalhah dan Kebun Bairuha’','s','Abu Thalhah adalah sahabat Anshar dengan kebun kurma terbanyak di Madinah, dan harta yang paling ia cintai adalah kebun Bairuha’ di dekat masjid. Nabi SAW sering masuk ke sana dan minum air jernihnya. Ketika turun ayat yang menyatakan bahwa kebajikan sempurna tidak tercapai sebelum menginfakkan harta yang dicintai, Abu Thalhah datang kepada Nabi dan menyedekahkan Bairuha’.<br><br>Nabi SAW menjawab bahwa itu harta yang menguntungkan, dan menyarankan agar ia membagikannya kepada kerabat dekatnya. Abu Thalhah melaksanakannya dengan membaginya kepada keluarga dan sepupunya.','HR. Bukhari no. 1461; HR. Muslim no. 998; QS. Ali Imran: 92','لَن تَنَالُوا الْبِرَّ حَتَّىٰ تُنفِقُوا مِمَّا تُحِبُّونَ','Lan tanaalul-birra hattaa tunfiquu mimmaa tuhibbuun.','“Kamu tidak akan memperoleh kebajikan sempurna sebelum kamu menginfakkan sebagian harta yang kamu cintai.”'],['Utsman bin Affan dan Sumur Raumah','h','Ketika kaum Muslimin di Madinah kekurangan air, sumur Raumah dimiliki seorang laki-laki yang menjual airnya. Nabi SAW bersabda, siapa yang membeli sumur Raumah lalu menjadikannya untuk kaum Muslimin, ia akan mendapat surga. Utsman bin Affan RA membelinya dengan hartanya dan mewakafkannya. Pelajaran: harta yang dialirkan untuk kepentingan umum adalah investasi akhirat.','HR. Tirmidzi no. 3703; HR. An-Nasa’i no. 3608 (dinilai hasan)'],['Anas bin Malik dan Doa Nabi','s','Ketika Nabi SAW hijrah ke Madinah, Ummu Sulaim membawa putranya, Anas, yang masih kecil, kepada Nabi dan berkata bahwa Anas akan melayani beliau, lalu memohon agar didoakan. Nabi mendoakan agar Allah memperbanyak harta dan anaknya, dan memberkahi apa yang telah Allah berikan.<br><br>Di masa tuanya Anas bersaksi bahwa hartanya sangat banyak, dan keturunannya mencapai lebih dari seratus orang. Dalam riwayat Tirmidzi, kebunnya berbuah dua kali setahun. Perhatikan bahwa doa Nabi menyebut “barakah”, bukan sekadar banyak.','HR. Bukhari no. 6334, 6344; HR. Muslim no. 2480; HR. Tirmidzi no. 3833 (hasan)','اللَّهُمَّ أَكْثِرْ مَالَهُ وَوَلَدَهُ، وَبَارِكْ لَهُ فِيمَا أَعْطَيْتَهُ','Allahumma ak-tsir maalahuu wa waladahuu, wa baarik lahuu fiimaa a’thaitah.','“Ya Allah, perbanyaklah hartanya dan anaknya, serta berkahilah apa yang Engkau berikan kepadanya.”']];
var N={'Abdurrahman bin Auf: Kaya dari Pasar':['Abdurrahman bin Auf: Kaya dari Pasar','s','Jamaah sekalian, mari kita bayangkan suasana Madinah di hari-hari pertama hijrah. Para Muhajirin datang membawa iman, tetapi hampir tanpa harta. Rumah, kebun, dan dagangan mereka tertinggal di Makkah. Di antara mereka ada Abdurrahman bin Auf radhiyallahu ’anhu, seorang pedagang yang piawai, namun saat itu tangannya kosong.<br><br>Rasulullah SAW lalu mempersaudarakan Muhajirin dengan Anshar. Abdurrahman dipersaudarakan dengan Sa’ad bin Ar-Rabi’. Lihatlah akhlak orang Anshar ini. Sa’ad berkata, “Saudaraku, aku orang Anshar yang paling banyak hartanya. Ambillah separuh hartaku. Aku juga punya dua istri; lihatlah mana yang engkau suka, akan kuceraikan, dan setelah selesai masa iddahnya engkau nikahi.” Subhanallah. Siapa hari ini yang mau berbagi sampai seperti itu?<br><br>Sekarang perhatikan jawaban Abdurrahman, karena di sinilah inti kisah kita. Ia tidak mengambil. Ia berkata, “Semoga Allah memberkahimu pada keluarga dan hartamu. Tunjukkan saja kepadaku di mana pasar.” Ia tidak minta modal, tidak minta dikasihani. Ia minta jalan untuk bekerja.<br><br>Maka berangkatlah ia ke pasar, berjual beli, dan beberapa hari kemudian pulang membawa keuntungan berupa keju dan samin. Usahanya terus berjalan. Tak lama, Nabi SAW melihat bekas wewangian kuning pada pakaiannya. “Ada apa, wahai Abdurrahman?” “Aku menikahi seorang wanita Anshar.” “Berapa maharmu?” “Emas seberat biji kurma.” Maka Nabi mendoakan, “Semoga Allah memberkahimu. Adakanlah walimah walau dengan seekor kambing.”<br><br>Kelak Abdurrahman menjadi salah satu sahabat terkaya, sekaligus salah satu yang paling dermawan, dan beliau termasuk sepuluh sahabat yang dikabarkan masuk surga. Sekarang coba kita renungkan: apakah rahasianya wirid tertentu? Tidak. Rahasianya ada tiga. Pertama, tidak menggantungkan diri pada pemberian orang. Kedua, bekerja dengan jujur. Ketiga, hartanya dipakai di jalan Allah. Maka kepada saudaraku yang sedang sempit, ambillah pelajaran ini: mintalah kepada Allah, ‘tunjukkan aku pasar’, yaitu bukakan jalan kerja yang halal.','HR. Bukhari no. 2048, 3780, 3781; HR. Tirmidzi no. 3747','دُلُّونِي عَلَى السُّوقِ','Dulluunii ’alas-suuq.','“Tunjukkan aku jalan menuju pasar.”'],'Nabi Musa AS di Madyan':['Nabi Musa AS di Madyan: Dari Pelarian Menuju Rezeki','q','Saudaraku, kisah ini panjang, dan setiap bagiannya mengandung pelajaran. Musa ’alaihissalam hidup di Mesir di bawah kekuasaan Fir’aun. Suatu hari ia mendapati dua laki-laki berkelahi, satu dari golongannya (Bani Israil) dan satu dari musuhnya. Orang dari golongannya minta tolong. Musa meninju musuh itu, dan tanpa ia maksudkan, orang itu mati. Seketika Musa sadar dan berkata, “Ini perbuatan setan,” lalu ia memohon, “Ya Tuhanku, sungguh aku telah menzalimi diriku, maka ampunilah aku.” Allah pun mengampuninya (QS. Al-Qasas: 15–16).<br><br>Keesokan harinya kabar menyebar. Seorang laki-laki datang berlari dari ujung kota memperingatkan bahwa para pembesar sedang berunding untuk membunuhnya, dan memintanya segera pergi. Musa keluar dalam keadaan takut dan waspada, sambil berdoa agar diselamatkan dari kaum yang zalim. Ia menuju Madyan dengan satu harapan: “Mudah-mudahan Tuhanku menunjukkan kepadaku jalan yang benar.” Perhatikan, ia berangkat tanpa bekal, tanpa tahu siapa yang akan ditemui.<br><br>Sampai di mata air Madyan, ia melihat para penggembala berebut memberi minum ternak, dan di sisi lain ada dua perempuan yang menahan kambingnya. Musa bertanya, “Ada apa dengan kalian?” Mereka menjawab, “Kami tidak dapat memberi minum sebelum para penggembala itu pergi, dan ayah kami sudah sangat tua.” Tanpa menunggu bayaran, Musa memberi minum ternak mereka, lalu berteduh di bawah naungan. Dalam kondisi lapar, letih, dan jauh dari rumah, inilah doanya: “Ya Tuhanku, sungguh aku sangat membutuhkan kebaikan apa pun yang Engkau turunkan kepadaku.”<br><br>Subhanallah, belum lama doa itu terucap, salah satu dari kedua perempuan itu datang berjalan dengan malu-malu: “Ayahku memanggilmu untuk memberi balasan atas kebaikanmu.” Musa menceritakan kisahnya, dan sang ayah menenangkan, “Jangan takut, engkau telah selamat dari kaum yang zalim.” Putrinya berkata, “Wahai ayah, pekerjakanlah dia. Sebaik-baik orang yang engkau pekerjakan adalah yang kuat lagi dapat dipercaya.” Sang ayah lalu menawarkan menikahkan Musa dengan salah satu putrinya, dengan mahar bekerja delapan tahun, dan jika Musa menggenapkan sepuluh tahun, itu kebaikan darinya.<br><br>Perhatikan urutannya: Musa menolong dahulu, baru berdoa; ia bekerja jujur, lalu Allah jadikan pekerjaannya sebagai sebab datangnya tempat tinggal dan keluarga. Catatan penting: Al-Qur’an tidak menyebut nama sang ayah. Sebagian ulama menyebutnya Syu’aib, tetapi tidak ada dalil sahih yang tegas, jadi kita cukup menyebutnya ‘orang tua yang saleh di Madyan’.','QS. Al-Qasas: 14–28','رَبِّ إِنِّي لِمَا أَنزَلْتَ إِلَيَّ مِنْ خَيْرٍ فَقِيرٌ','Rabbi innii limaa anzalta ilayya min khairin faqiir.','“Ya Tuhanku, sungguh aku sangat memerlukan sesuatu kebaikan yang Engkau turunkan kepadaku.” (QS. Al-Qasas: 24)'],'Nabi Yusuf AS: Menyimpan di Masa Lapang':['Nabi Yusuf AS: Dari Dasar Sumur Menjadi Bendahara','q','Jamaah sekalian, Allah menyebut kisah Yusuf sebagai ‘ahsanul qashash’, sebaik-baik kisah. Ia bermula dari mimpi seorang anak kecil, yang melihat sebelas bintang, matahari, dan bulan bersujud kepadanya. Ayahnya, Nabi Ya’qub, berpesan agar Yusuf tidak menceritakan mimpi itu kepada saudara-saudaranya, karena khawatir mereka akan iri.<br><br>Dan benarlah. Saudara-saudaranya iri, lalu membuang Yusuf ke dasar sumur. Seorang kafilah menemukannya, dan ia dijual dengan harga murah. Allah mempertemukannya dengan pembesar Mesir yang berpesan kepada istrinya agar memuliakan Yusuf. Namun ujian berikutnya lebih berat: istri pembesar itu menggodanya. Yusuf menjawab dengan kalimat yang harus kita hafal, “Ma’adzallah, aku berlindung kepada Allah.” Karena menjaga kehormatan, ia justru difitnah dan dipenjara.<br><br>Di dalam penjara ia tetap berdakwah dan mengajarkan tauhid, bahkan menakwilkan mimpi dua pemuda di sana. Bertahun-tahun kemudian, raja Mesir bermimpi tujuh sapi gemuk dimakan tujuh sapi kurus, dan tujuh bulir hijau serta tujuh bulir kering. Tak ada yang mampu menakwilkannya. Salah satu pemuda yang pernah di penjara teringat Yusuf. Yusuf menafsirkan: akan datang tujuh tahun masa subur, lalu tujuh tahun paceklik. Solusinya jelas: tanam dengan sungguh-sungguh, biarkan hasilnya di tangkainya, ambil secukupnya untuk dimakan, dan simpan sisanya.<br><br>Raja takjub dan memanggilnya. Yusuf menolak keluar sebelum kebersihan namanya dinyatakan, dan setelah terbukti, raja berkata, “Hari ini engkau di sisi kami adalah orang yang berkedudukan tinggi lagi dipercaya.” Lalu Yusuf meminta, “Jadikanlah aku bendahara negeri ini. Sungguh aku pandai menjaga lagi berpengetahuan.” Ia tidak malu mengajukan diri, karena ia tahu kompetensinya. Dan Allah berfirman bahwa Dia memberi kedudukan kepada Yusuf di bumi Mesir.<br><br>Ketika paceklik melanda, negeri-negeri sekitar datang membeli makanan, termasuk saudara-saudaranya, yang tidak mengenalinya. Di akhir kisah, Yusuf memaafkan mereka dan berdoa dengan doa seorang hamba yang bersyukur dan rendah hati, agar diwafatkan sebagai muslim dan dikumpulkan bersama orang-orang saleh.<br><br>Apa pelajarannya? Kekayaan tidak selalu datang cepat. Ia bisa didahului sumur dan penjara. Tetapi orang yang sabar, jujur, menjaga diri dari yang haram, dan menguasai keahliannya, akan Allah angkat pada waktunya. Dan rezeki juga soal perencanaan: menyimpan di masa lapang adalah bagian dari tawakal.','QS. Yusuf: 4–101','قَالَ اجْعَلْنِي عَلَىٰ خَزَائِنِ الْأَرْضِ ۖ إِنِّي حَفِيظٌ عَلِيمٌ','Qaalaj’alnii ’alaa khazaa-inil-ardh, innii hafiizhun ’aliim.','“Jadikanlah aku bendahara negeri (Mesir), sungguh aku adalah orang yang pandai menjaga lagi berpengetahuan.” (QS. Yusuf: 55)'],'Tiga Orang di Dalam Gua':['Tiga Orang di Dalam Gua: Amal Saleh yang Membuka Jalan Keluar','s','Jamaah sekalian, kisah ini diceritakan langsung oleh Rasulullah SAW dari umat terdahulu. Ada tiga orang berjalan bersama, lalu bermalam di sebuah gua. Tiba-tiba sebongkah batu besar jatuh dari gunung dan menutup mulut gua. Mereka berusaha menggesernya, tetapi sia-sia. Maka sebagian berkata kepada yang lain, “Tidak ada yang menyelamatkan kita kecuali jika kita berdoa kepada Allah dengan menyebut amal saleh yang pernah kita lakukan dengan ikhlas.”<br><br>Orang pertama berkata, “Ya Allah, aku memiliki kedua orang tua yang sudah renta. Aku tidak pernah memberi minum susu kepada istri dan anak-anakku sebelum keduanya. Suatu hari aku terlambat pulang karena jauh mencari gembalaan, dan mereka sudah tertidur. Aku memerah susu, lalu berdiri membawa bejana itu di dekat kepala mereka. Aku enggan membangunkan, dan enggan mendahulukan keluargaku, padahal anak-anakku menangis di kakiku. Itulah keadaanku hingga fajar. Jika aku melakukannya karena mengharap wajah-Mu, bukakanlah celah agar kami bisa melihat langit.” Allah membuka celah kecil.<br><br>Orang kedua berkata, “Ya Allah, aku mencintai seorang sepupu perempuan lebih dari segalanya. Aku menginginkannya, tetapi ia menolak sampai aku membawa sejumlah dinar. Aku berusaha keras mengumpulkannya. Ketika aku telah duduk di antara kedua kakinya, ia berkata, ‘Bertakwalah kepada Allah, dan jangan buka cincin kecuali dengan haknya.’ Aku langsung berdiri meninggalkannya dan meninggalkan dinar yang telah kuberikan. Jika aku melakukannya karena mengharap wajah-Mu, bukakanlah bagi kami.” Maka batu itu bergeser lagi.<br><br>Orang ketiga berkata, “Ya Allah, aku pernah mempekerjakan beberapa buruh dan membayar upah mereka, kecuali satu orang yang pergi meninggalkan upahnya. Upah itu aku kembangkan hingga menjadi harta yang banyak. Bertahun-tahun kemudian ia datang, ‘Wahai hamba Allah, berikan upahku.’ Aku berkata, ‘Semua yang kau lihat, unta, sapi, kambing, dan budak itu milikmu.’ Ia berkata, ‘Jangan mengejekku.’ Aku jawab, ‘Aku tidak mengejekmu.’ Maka ia membawanya semua. Jika aku melakukannya karena mengharap wajah-Mu, bukakanlah.” Batu itu pun bergeser hingga mereka keluar berjalan.<br><br>Perhatikan, para ulama menjelaskan bahwa kisah ini adalah dalil bolehnya bertawassul dengan amal saleh kita sendiri. Yang mereka sebut bukan nama orang saleh, melainkan bakti kepada orang tua, menjaga diri dari zina, dan amanah dalam urusan harta.','HR. Bukhari no. 2272, 2215; HR. Muslim no. 2743'],'Qarun: Kaya Tanpa Syukur':['Qarun: Ketika Harta Menjadi Azab','q','Saudaraku, kisah Qarun adalah peringatan bagi siapa pun yang bercita-cita kaya. Qarun berasal dari kaum Nabi Musa. Allah memberinya harta yang kunci-kunci gudangnya saja berat dipikul oleh sekelompok orang kuat. Tetapi lihat apa yang terjadi pada hatinya: ia sombong.<br><br>Kaumnya menasihatinya dengan tiga hal, dan inilah ‘resep’ kekayaan yang selamat. Pertama, “Janganlah engkau terlalu bangga, sesungguhnya Allah tidak menyukai orang yang membanggakan diri.” Kedua, “Carilah pada apa yang dianugerahkan Allah kepadamu negeri akhirat.” Ketiga, “Jangan lupakan bagianmu di dunia, dan berbuat baiklah sebagaimana Allah berbuat baik kepadamu, dan jangan berbuat kerusakan.” Perhatikan, Islam tidak melarang menikmati dunia, tetapi dunia bukan tujuan akhir.<br><br>Apa jawaban Qarun? “Sesungguhnya aku diberi harta ini karena ilmu yang ada padaku.” Ia lupa bahwa Allah telah membinasakan banyak umat sebelumnya yang lebih kuat dan lebih banyak harta. Suatu hari ia keluar di hadapan kaumnya dengan segala kemegahan. Orang-orang yang mencintai dunia berkata, “Andai kami punya seperti yang diberikan kepada Qarun. Sungguh ia memiliki keberuntungan besar.” Tetapi orang-orang yang diberi ilmu berkata, “Celaka kalian! Pahala Allah lebih baik bagi orang yang beriman dan beramal saleh.”<br><br>Lalu apa akhirnya? Allah membenamkan Qarun dan rumahnya ke dalam bumi. Tidak ada golongan yang dapat menolongnya selain Allah, dan ia tidak termasuk orang yang dapat membela diri. Besok paginya, orang-orang yang kemarin iri berkata, “Aduhai, ternyata Allah melapangkan dan menyempitkan rezeki bagi siapa yang Dia kehendaki. Kalau bukan karena karunia Allah kepada kita, tentu kita pun dibenamkan.”<br><br>Jamaah sekalian, pesan kisah ini sangat jelas: orang yang menginginkan kaya hendaknya meminta kekayaan yang selamat, yaitu yang diiringi syukur, sedekah, dan kerendahan hati. Harta bukan ukuran kemuliaan, dan yang kita khawatirkan bukan miskinnya, tetapi lalainya.','QS. Al-Qasas: 76–82','وَلَا تَنسَ نَصِيبَكَ مِنَ الدُّنْيَا ۖ وَأَحْسِن كَمَا أَحْسَنَ اللَّهُ إِلَيْكَ','Wa laa tansa nashiibaka minad-dunyaa wa ahsin kamaa ahsanallaahu ilaik.','“Janganlah kamu lupakan bagianmu di dunia, dan berbuat baiklah (kepada orang lain) sebagaimana Allah berbuat baik kepadamu.” (QS. Al-Qasas: 77)'],'Hajar dan Ismail: Berlari Mencari Air':['Hajar dan Ismail: Ketika Tawakal Berjalan Bersama Usaha','s','Jamaah sekalian, kisah ini diceritakan Rasulullah SAW sebagaimana diriwayatkan Ibnu Abbas, dan ia adalah asal mula sa’i yang kita lakukan saat haji dan umrah. Nabi Ibrahim ’alaihissalam membawa istrinya, Hajar, dan bayi mereka, Ismail, ke lembah Makkah, yang saat itu tak berpenghuni, tanpa air dan tanaman. Ia menaruh mereka di dekat sebatang pohon, meninggalkan sekantong kurma dan wadah air, lalu berbalik pergi.<br><br>Hajar mengikutinya sambil bertanya, “Wahai Ibrahim, ke mana engkau pergi meninggalkan kami di lembah yang tak ada siapa pun dan apa pun?” Berkali-kali ia bertanya, tetapi Ibrahim tidak menoleh. Barulah Hajar bertanya, “Apakah Allah yang memerintahkanmu ini?” Ibrahim menjawab, “Ya.” Dan lihatlah jawaban seorang ibu yang beriman: “Kalau begitu, Dia tidak akan menyia-nyiakan kami.” Ia pun kembali.<br><br>Di bukit Tsaniyyah, Ibrahim menghadap Ka’bah dan mengangkat tangan berdoa agar Allah menjadikan hati manusia condong kepada keluarganya, dan memberi mereka rezeki berupa buah-buahan. Hari-hari berlalu, dan bekal habis. Ismail mulai kehausan dan menggeliat. Hajar tak tega melihatnya. Ia naik ke bukit Shafa mencari tanda adanya orang, lalu turun dan berlari kecil di tengah lembah hingga melewatinya, naik ke Marwa, dan melakukannya tujuh kali.<br><br>Perhatikan, jamaah, Hajar tidak duduk menangis menunggu keajaiban. Ia pasrah kepada perintah Allah, tetapi tetap berusaha dengan kekuatan penuh. Setelah putaran ketujuh di Marwa, ia mendengar suara. Ia kembali kepada Ismail dan melihat air memancar di bawah tumit anaknya, atau oleh Jibril, sebagaimana tertulis dalam hadis. Hajar membendungnya dengan tangan sambil mengucapkan “zamzam”, lalu minum dan menyusui anaknya. Rasulullah SAW bersabda, “Semoga Allah merahmati ibu Ismail. Andai ia membiarkan Zamzam, niscaya ia menjadi mata air yang mengalir.”<br><br>Kemudian suku Jurhum melintas, melihat burung berputar di atas lembah, dan mereka tahu itu pertanda air. Mereka meminta izin tinggal, dan Hajar mengizinkan. Dari sinilah Makkah menjadi kota. Doa Ibrahim terkabul: hati manusia condong kepada mereka, dan rezeki mengalir hingga hari ini.<br><br>Maka kepada para ibu dan ayah yang sedang sempit: tawakal itu bukan pasrah tanpa usaha. Tawakal adalah berlari antara Shafa dan Marwa sambil yakin bahwa air akan keluar dari tempat yang tak disangka.','HR. Bukhari no. 3364; QS. Ibrahim: 37','فَاجْعَلْ أَفْئِدَةً مِّنَ النَّاسِ تَهْوِي إِلَيْهِمْ وَارْزُقْهُم مِّنَ الثَّمَرَاتِ لَعَلَّهُمْ يَشْكُرُونَ','Faj’al af-idatam minan-naasi tahwii ilaihim warzuqhum minats-tsamaraati la’allahum yasykuruun.','“Maka jadikanlah hati sebagian manusia condong kepada mereka dan berilah mereka rezeki dari buah-buahan, mudah-mudahan mereka bersyukur.” (QS. Ibrahim: 37)'],'Nabi Yunus AS: Doa dari Perut Ikan':['Nabi Yunus AS: Doa dari Tiga Kegelapan','q','Jamaah sekalian, kisah Nabi Yunus ’alaihissalam adalah kisah tentang kembali kepada Allah ketika semua jalan telah tertutup. Yunus diutus kepada penduduk Ninawa. Ia berdakwah lama, tetapi mereka tidak beriman. Karena kecewa, ia pergi meninggalkan mereka dalam keadaan marah, sebelum Allah mengizinkannya. Padahal seorang nabi tidak boleh meninggalkan kaumnya sebelum ada perintah dari Allah (QS. Al-Anbiya’: 87).<br><br>Ia lalu menaiki kapal yang penuh muatan. Di tengah lautan, kapal terancam tenggelam, dan para penumpang sepakat mengundi siapa yang harus dilempar ke laut. Undian jatuh pada Yunus. Dan Allah menceritakan bahwa ia adalah orang yang tercela di sini, dalam arti ia telah melakukan kesalahan. Maka ia dilempar ke laut, lalu ditelan ikan besar.<br><br>Bayangkan: gelap malam, gelap lautan, gelap perut ikan. Tiga kegelapan. Tak ada orang yang bisa menolong, tak ada jalan keluar. Dan apa yang diucapkan Yunus? Bukan keluhan. Ia berseru, “Tidak ada Tuhan selain Engkau, Mahasuci Engkau, sungguh aku termasuk orang-orang yang zalim.” Ia mengakui keagungan Allah, lalu mengakui kesalahannya. Allah berfirman bahwa jika ia tidak termasuk orang yang banyak bertasbih, niscaya ia tinggal di perut ikan hingga hari kebangkitan (QS. Ash-Shaffat: 143–144).<br><br>Maka Allah menyelamatkannya. Ia dilemparkan ke daratan dalam keadaan sakit, dan Allah menumbuhkan pohon yaqtin untuk menaunginya. Kemudian ia kembali kepada kaumnya, seratus ribu orang atau lebih, dan kali ini mereka beriman, sehingga Allah memberi mereka kenikmatan hidup hingga waktu tertentu.<br><br>Rasulullah SAW bersabda, “Doa Dzun Nun ketika berada di perut ikan: laa ilaaha illaa anta subhaanaka innii kuntu minazh-zhaalimiin. Tidaklah seorang muslim berdoa dengannya untuk suatu perkara kecuali Allah akan mengabulkannya.” Jadi inilah pegangan kita ketika buntu, terlilit utang, atau ketika semua pintu tampak tertutup: tasbih, pengakuan kesalahan, dan kembali kepada Allah.','QS. Al-Anbiya’: 87–88; QS. Ash-Shaffat: 139–148; HR. Tirmidzi no. 3505','لَا إِلَٰهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ','Laa ilaaha illaa anta subhaanaka innii kuntu minazh-zhaalimiin.','“Tidak ada Tuhan selain Engkau, Mahasuci Engkau, sungguh aku termasuk orang-orang yang zalim.” (QS. Al-Anbiya’: 87)'],'Tiga Orang Bani Israil: Belang, Botak, dan Buta':['Belang, Botak, dan Buta: Ujian Nikmat','s','Jamaah sekalian, hadis ini diriwayatkan Abu Hurairah radhiyallahu ’anhu dari Rasulullah SAW. Ada tiga orang dari Bani Israil: seorang penderita belang di kulit, seorang yang botak, dan seorang yang buta. Allah hendak menguji mereka, lalu mengutus seorang malaikat dalam rupa manusia.<br><br>Malaikat itu mendatangi si belang dan bertanya, “Apa yang paling engkau inginkan?” Ia menjawab, “Warna kulit yang bagus dan hilangnya penyakit ini, karena orang-orang jijik padaku.” Malaikat mengusapnya, maka sembuhlah ia, dan diberi unta yang bunting. Ia mendoakan keberkahan. Lalu ia mendatangi si botak, yang ingin rambut indah, diusap dan sembuh, lalu diberi sapi bunting. Terakhir si buta, yang ingin Allah mengembalikan penglihatannya. Ia diusap dan dapat melihat, lalu diberi kambing yang bunting.<br><br>Maka beranak-pinaklah ternak mereka, hingga satu memiliki lembah penuh unta, satu lembah penuh sapi, dan satu lembah penuh kambing. Beberapa waktu kemudian, malaikat datang lagi dalam rupa mereka dahulu. Kepada si belang ia berkata, “Aku orang miskin, bekalku habis dalam perjalanan. Aku memohon kepada Allah, lalu kepadamu, berilah aku seekor unta untuk sampai tujuan.” Si belang menjawab, “Hak-hak banyak.” Malaikat berkata, “Sepertinya aku mengenalmu. Bukankah kau dahulu belang, dihina orang, miskin, lalu Allah memberimu?” Ia menjawab, “Aku mewarisi harta ini turun-temurun dari nenek moyangku.” Malaikat berkata, “Jika engkau berdusta, semoga Allah mengembalikanmu seperti semula.” Si botak pun menjawab sama dan mengalami hal yang sama.<br><br>Lalu malaikat mendatangi si buta, dan berkata, “Aku musafir yang kehabisan bekal. Aku minta seekor kambing.” Si buta menjawab, “Aku dahulu buta, lalu Allah mengembalikan penglihatanku. Ambillah apa yang engkau mau, dan tinggalkan apa yang engkau mau. Demi Allah, hari ini aku tidak keberatan atas apa pun yang engkau ambil karena Allah.” Maka malaikat berkata, “Tahanlah hartamu. Sesungguhnya kalian hanya diuji. Allah ridha kepadamu dan murka kepada kedua temanmu.”<br><br>Perhatikan: kedua temannya bukan miskin kembali karena tidak punya usaha, tetapi karena lupa asal nikmat. Maka bila Allah memberi kita rezeki, sebutlah, ‘ini dari Allah’, dan jangan menahan hak orang yang meminta.','HR. Bukhari no. 3464; HR. Muslim no. 2964']};
Object.assign(N,{'Nabi Ayyub AS: Sabar Setelah Hilang Segalanya':['Nabi Ayyub AS: Sabar yang Indah','s','Jamaah sekalian, kalau kita ingin belajar sabar saat sempit, lihatlah Nabi Ayyub ’alaihissalam. Allah memujinya dengan pujian yang sangat tinggi: “Sebaik-baik hamba, sungguh ia sangat taat (kembali kepada Allah).” Ia diuji dengan penyakit yang berat dan hilangnya banyak nikmat. Tetapi lihat bagaimana ia berdoa. Ia tidak mengeluh kepada manusia, tidak menyalahkan takdir. Ia hanya berkata, “Sungguh aku telah ditimpa penyakit, dan Engkaulah Yang Maha Penyayang di antara semua penyayang.” Ia menyebut keadaannya, lalu memuji kasih sayang Allah. Itu saja. Subhanallah, adabnya luar biasa.<br><br>Maka Allah menjawab dengan cepat dan lembut. Dalam Surat Shad, Allah memerintahkan, “Hentakkan kakimu; inilah air yang sejuk untuk mandi dan untuk minum.” Allah menyembuhkannya, mengembalikan keluarganya dan melipatgandakan jumlahnya, sebagai rahmat dari sisi-Nya dan peringatan bagi orang-orang yang berakal.<br><br>Sekarang perhatikan hadis sahih yang menjadi favorit kita bila membicarakan rezeki. Rasulullah SAW menceritakan: ketika Ayyub sedang mandi dalam keadaan tanpa pakaian, tiba-tiba jatuh kepadanya belalang-belalang dari emas. Maka Ayyub segera menciduknya dengan kedua tangan ke dalam bajunya. Lalu Tuhannya memanggil, “Wahai Ayyub, bukankah Aku telah mencukupkanmu dari apa yang engkau lihat itu?” Ayyub menjawab, “Benar, ya Rabb, demi kemuliaan-Mu. Tetapi aku tidak pernah merasa cukup dari berkah-Mu.”<br><br>Perhatikan kalimat terakhir itu. Ayyub tidak berkata, ‘aku tamak.’ Ia berkata bahwa ia tidak pernah merasa cukup dengan berkah dari Allah, dan itu bukan tercela bila yang dicari adalah karunia yang halal dari-Nya. Tetapi yang tak kalah penting, ia tidak pernah menyebut harta sebagai sumber keselamatannya. Ia hanya menyebut Allah.<br><br>Jadi apa pelajaran bagi kita yang sedang sempit? Pertama, sebutlah kesulitan itu kepada Allah, bukan dengan mengeluh kepada manusia. Kedua, tetap berbaik sangka. Ketiga, pintalah berkah, bukan sekadar banyak. Dan catatan dari para ulama: kisah tentang lamanya sakit Nabi Ayyub dan cerita-cerita tambahan lainnya bersumber dari Israiliyat, sehingga tidak kita pakai.','QS. Al-Anbiya’: 83–84; QS. Shad: 41–44; HR. Bukhari no. 279','أَنِّي مَسَّنِيَ الضُّرُّ وَأَنتَ أَرْحَمُ الرَّاحِمِينَ','Annii massaniyadh-dhurru wa anta arhamur-raahimiin.','“(Ya Tuhanku), sungguh aku telah ditimpa penyakit, dan Engkaulah Yang Maha Penyayang di antara semua penyayang.” (QS. Al-Anbiya’: 83)'],'Utang Seribu Dinar dan Kayu di Lautan':['Utang Seribu Dinar: Amanah yang Dibayar Allah','s','Jamaah sekalian, kisah ini diceritakan Rasulullah SAW tentang seorang dari Bani Israil, dan ia sangat cocok bagi kita yang sedang berurusan dengan utang. Ada seorang laki-laki meminta pinjaman seribu dinar kepada temannya. Si pemberi pinjaman berkata, “Datangkan saksi yang bisa kupersaksikan.” Ia menjawab, “Cukuplah Allah sebagai saksi.” Ia berkata, “Datangkan penjamin.” Ia menjawab, “Cukuplah Allah sebagai penjamin.” Maka si pemberi pinjaman berkata, “Engkau benar,” dan menyerahkan uangnya sampai waktu yang ditentukan.<br><br>Peminjam pun berlayar dan menyelesaikan keperluannya. Ketika jatuh tempo, ia mencari kapal untuk menyeberang dan membayar utangnya, tetapi tidak mendapat satu pun. Lalu apa yang ia lakukan? Ia tidak menyerah, dan ia juga tidak berbohong. Ia mengambil sebatang kayu, melubanginya, memasukkan seribu dinar beserta secarik surat untuk pemiliknya, lalu menutupnya rapat. Ia membawanya ke tepi laut dan berdoa, “Ya Allah, Engkau tahu bahwa aku meminjam seribu dinar dari si fulan. Ia meminta penjamin, aku katakan, cukup Allah penjaminnya, dan ia ridha. Ia meminta saksi, aku katakan, cukup Allah saksinya, dan ia ridha. Aku telah berusaha keras mencari kapal untuk mengirimkan hartanya, tetapi tak mampu. Maka aku titipkan ia kepada-Mu.” Lalu ia melemparkan kayu itu ke laut.<br><br>Sementara itu, si pemberi pinjaman keluar menunggu kapal yang membawa uangnya. Tak ada kapal, tetapi ia menemukan sebatang kayu yang hanyut, lalu membawanya pulang untuk kayu bakar. Ketika dibelah, ia mendapati uang dan surat itu di dalamnya.<br><br>Beberapa waktu kemudian, si peminjam akhirnya tiba membawa seribu dinar lagi, sambil berkata, “Demi Allah, aku terus berusaha mencari kapal untuk membawa hartamu, dan tidak menemukannya sebelum yang kutumpangi sekarang.” Si pemberi pinjaman berkata, “Apakah engkau mengirim sesuatu kepadaku?” Ia menjawab, “Sudah kukatakan, aku tak menemukan kapal.” Maka ia berkata, “Sesungguhnya Allah telah menunaikan atas namamu apa yang engkau kirim dalam kayu itu. Maka bawalah kembali seribu dinarmu dengan rasa lega.”<br><br>Apa pelajarannya? Pertama, berusaha sungguh-sungguh melunasi utang, tidak menunda dan tidak berdalih. Kedua, jujur dalam janji. Ketiga, setelah berusaha, serahkan hasilnya kepada Allah. Dan ingat, Nabi SAW menyampaikan bahwa siapa yang mengambil harta orang lain dengan niat melunasinya, Allah akan menolong melunasinya (Bukhari 2387). Jadi niat dan kesungguhan itu dilihat Allah.','HR. Bukhari no. 2291; HR. Bukhari no. 2387'],'Abu Hurairah dan Semangkuk Susu':['Abu Hurairah dan Semangkuk Susu: Kenyang Karena Berbagi','s','Jamaah sekalian, ini kisah yang sangat menyentuh, diceritakan sendiri oleh Abu Hurairah radhiyallahu ’anhu. Beliau berkata, “Demi Allah yang tiada Tuhan selain Dia, dahulu aku menempelkan perutku ke tanah karena lapar, dan aku mengikatkan batu di perutku.” Subhanallah. Inilah perawi hadis terbanyak umat ini, dan inilah keadaannya.<br><br>Suatu hari ia duduk di jalan yang biasa dilalui para sahabat. Abu Bakar lewat. Abu Hurairah bertanya tentang satu ayat dari Kitabullah, padahal ia tahu jawabannya. Ia bertanya hanya agar Abu Bakar mengajaknya makan. Tetapi Abu Bakar menjawab lalu pergi. Lalu Umar lewat, dan terjadi hal yang sama. Kemudian lewatlah Rasulullah SAW. Begitu melihatnya, beliau tersenyum, dan beliau tahu apa yang ada di wajah dan di hati Abu Hurairah. “Abu Hirr!” “Labbaik, ya Rasulullah.” “Ikutlah.”<br><br>Beliau masuk rumah, dan Abu Hurairah meminta izin lalu diizinkan. Di dalam ada semangkuk susu. “Dari mana susu ini?” “Dihadiahkan kepada Anda oleh si fulan.” Lalu beliau bersabda, “Abu Hirr, pergilah kepada ahlus suffah dan panggil mereka.” Ahlus suffah adalah para tamu Islam yang tinggal di serambi masjid, tak punya keluarga dan tak punya harta. Bila Nabi mendapat sedekah, beliau kirim semuanya kepada mereka tanpa mengambil sedikit pun; bila mendapat hadiah, beliau ambil sebagian dan membagi kepada mereka.<br><br>Abu Hurairah jujur menceritakan isi hatinya: perintah itu membuatnya gelisah. Ia berkata, “Susu sebanyak ini apa artinya bagi ahlus suffah? Padahal aku yang lebih berhak minum sedikit untuk menguatkan badanku.” Tetapi ia tetap taat. Setelah mereka datang, Nabi menyuruhnya, “Berikan kepada mereka.” Maka ia memberikan kepada satu orang, ia minum hingga puas, lalu kepada yang lain, hingga semua kenyang. Lalu Nabi mengambil mangkuk itu, memandang Abu Hurairah dan tersenyum, “Tinggal aku dan engkau.” “Benar, ya Rasulullah.” “Duduk dan minumlah.” Ia minum. “Minumlah lagi.” Ia minum lagi. Terus beliau menyuruhnya minum hingga ia berkata, “Demi Dzat yang mengutusmu dengan kebenaran, aku sudah tidak mendapati tempat lagi.” Barulah Nabi memuji Allah, membaca basmalah, dan meminum sisanya.<br><br>Jamaah, perhatikan urutannya: yang paling lapar diutamakan terakhir, yang paling dermawan menyuguhkan, dan yang sedikit menjadi cukup. Maka orang yang taat dan berbagi, Allah beri keberkahan pada yang sedikit.','HR. Bukhari no. 6452'],'Fatimah, Ali, dan Dzikir Sebelum Tidur':['Fatimah dan Ali: Dzikir yang Lebih Baik dari Pembantu','s','Jamaah sekalian, mari kita lihat rumah tangga yang paling mulia di muka bumi: rumah Ali bin Abi Thalib dan Fatimah radhiyallahu ’anhuma, putri Rasulullah SAW. Bagaimana kehidupan mereka? Ali sendiri menceritakan bahwa Fatimah menggiling gandum dengan batu giling sampai tangannya berbekas, memikul wadah air sampai membekas di lehernya, dan menyapu rumah hingga pakaiannya berdebu. Ini putri seorang nabi.<br><br>Ketika Nabi SAW mendapat beberapa tawanan, Ali berkata kepada Fatimah, “Pergilah menemui ayahmu, mintalah seorang pelayan.” Fatimah pergi, tetapi Nabi sedang tidak ada, sehingga ia menyampaikan keperluannya kepada Aisyah. Ketika Nabi pulang, Aisyah menyampaikannya. Maka malam itu Nabi mendatangi mereka ketika keduanya sudah berbaring di tempat tidur. Mereka hendak bangun, tetapi Nabi bersabda, “Tetaplah di tempat kalian.” Beliau duduk di antara mereka, hingga Ali merasakan dinginnya kaki Nabi di dadanya.<br><br>Lalu beliau bersabda, “Maukah kalian kuajarkan sesuatu yang lebih baik dari apa yang kalian minta? Apabila kalian hendak tidur, bertasbihlah tiga puluh tiga kali, bertahmidlah tiga puluh tiga kali, dan bertakbirlah tiga puluh empat kali. Itu lebih baik bagi kalian berdua daripada seorang pelayan.”<br><br>Dan bagaimana Ali menyikapinya? Ia berkata, “Aku tidak pernah meninggalkannya sejak kudengar dari Rasulullah SAW.” Seseorang bertanya, “Bahkan pada malam perang Shiffin?” Ali menjawab, “Bahkan pada malam perang Shiffin.” Subhanallah, di tengah situasi yang sangat berat pun ia tidak meninggalkannya.<br><br>Pelajaran bagi kita: Nabi tidak mengabaikan kebutuhan putrinya. Beliau memberi solusi yang lebih menguatkan: dzikir yang menenangkan hati dan memberi tenaga. Ini bukan berarti kita tidak boleh meminta bantuan atau mencari penghasilan, tetapi dzikir adalah bekal yang menyertai kerja keras. Maka bagi rumah tangga yang sedang sempit, jadikan dzikir ini kebiasaan sebelum tidur, dan lihat berkahnya.','HR. Bukhari no. 3113, 5361; HR. Muslim no. 2727','سُبْحَانَ اللَّهِ (٣٣) الْحَمْدُ لِلَّهِ (٣٣) اللَّهُ أَكْبَرُ (٣٤)','Subhaanallaah (33x), Alhamdulillaah (33x), Allaahu akbar (34x).','Mahasuci Allah, segala puji bagi Allah, Allah Mahabesar.'],'Ashabul Kahfi: Pemuda yang Dijaga Allah':['Ashabul Kahfi: Pemuda yang Menjaga Iman dan Makanan Halal','q','Jamaah sekalian, Allah menyebut mereka ‘fityah’, pemuda. Ini penting: yang berani menjaga iman di tengah kaum yang menyembah selain Allah adalah pemuda. Allah berfirman, “Mereka adalah para pemuda yang beriman kepada Tuhan mereka, dan Kami tambahkan petunjuk kepada mereka.” Allah meneguhkan hati mereka ketika mereka berdiri dan berkata, “Tuhan kami adalah Tuhan langit dan bumi. Kami tidak akan menyeru tuhan selain Dia.”<br><br>Mereka lalu bersepakat, “Apabila kalian telah menjauhi mereka dan apa yang mereka sembah selain Allah, maka berlindunglah ke dalam gua, niscaya Tuhanmu akan melimpahkan sebagian rahmat-Nya kepadamu dan menyediakan sesuatu yang berguna bagimu dalam urusanmu.” Maka mereka masuk gua dan berdoa, “Ya Tuhan kami, berilah kami rahmat dari sisi-Mu dan sempurnakanlah bagi kami petunjuk yang lurus dalam urusan kami.” Allah menidurkan mereka bertahun-tahun, menjaga tubuh mereka, dan seekor anjing mereka berbaring di ambang pintu gua. Al-Qur’an menyebut lama tidur mereka tiga ratus tahun ditambah sembilan tahun.<br><br>Ketika Allah membangunkan mereka, mereka saling bertanya, “Berapa lama kalian tinggal di sini?” Sebagian menjawab, “Sehari atau setengah hari.” Yang lain berkata, “Tuhan kalian lebih tahu.” Lalu mereka lapar. Maka mereka mengutus salah satu dari mereka membawa uang perak ke kota. Dan perhatikan pesan mereka: “Hendaklah ia melihat makanan mana yang paling baik (halal dan bersih), lalu membawakan sebagian rezeki itu untuk kalian, dan hendaklah ia berlaku lemah lembut, dan jangan sekali-kali memberitahukan keadaan kalian kepada seorang pun.”<br><br>Subhanallah. Dalam keadaan lapar, dalam pelarian, yang pertama kali mereka pikirkan adalah kehalalan makanan. Bukan sekadar kenyang. Mereka khawatir bila ketahuan, mereka akan dirajam atau dipaksa kembali pada agama kaum itu, dan itu kerugian yang sangat besar.<br><br>Namun Allah menghendaki lain: keberadaan mereka diketahui orang-orang, agar manusia tahu bahwa janji Allah adalah benar dan bahwa kiamat tidak diragukan. Pelajaran bagi kita: iman dijaga dengan hijrah dari lingkungan yang merusak, rezeki dijaga dengan memilih yang halal, dan penjagaan Allah menyertai orang yang menjaga agama-Nya.','QS. Al-Kahfi: 9–26','رَبَّنَا آتِنَا مِن لَّدُنكَ رَحْمَةً وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًا','Rabbanaa aatinaa min ladunka rahmatan wa hayyi’ lanaa min amrinaa rasyadaa.','“Ya Tuhan kami, berilah kami rahmat dari sisi-Mu dan sempurnakanlah bagi kami petunjuk yang lurus dalam urusan kami.” (QS. Al-Kahfi: 10)'],'Pemilik Dua Kebun dan Ashabul Jannah':['Pemilik Dua Kebun: Ketika Lupa Mengucap Masya Allah','q','Jamaah sekalian, dalam Surat Al-Kahfi Allah membuat sebuah perumpamaan tentang dua orang laki-laki. Salah satunya Allah beri dua kebun anggur yang dikelilingi pohon kurma, dan di antara keduanya ada ladang. Kedua kebun itu berbuah lebat, tidak kurang sedikit pun, dan Allah mengalirkan sungai di tengahnya. Ia punya banyak hasil, dan itu membuat hatinya sombong.<br><br>Suatu hari ia berkata kepada temannya sambil berdebat, “Hartaku lebih banyak daripadamu, dan pengikutku lebih kuat.” Lalu ia memasuki kebunnya dalam keadaan menzalimi diri sendiri, dan berkata, “Aku kira kebun ini tidak akan binasa selamanya, dan aku tidak mengira kiamat akan datang. Kalaupun aku dikembalikan kepada Tuhanku, tentu aku akan mendapat tempat yang lebih baik dari ini.”<br><br>Teman yang beriman menasihatinya, “Apakah engkau kafir kepada Dzat yang menciptakanmu dari tanah? Tetapi aku, Dia-lah Allah, Tuhanku, dan aku tidak mempersekutukan seorang pun dengan Tuhanku. Mengapa ketika engkau memasuki kebunmu engkau tidak mengucapkan, Masya Allah, laa quwwata illaa billaah? Jika engkau melihat hartaku dan anakku lebih sedikit darimu, boleh jadi Tuhanku memberiku yang lebih baik dari kebunmu, dan Dia mengirim bencana dari langit ke kebunmu.”<br><br>Dan benar. Hasil kebunnya dibinasakan. Pagi harinya ia membolak-balikkan kedua telapak tangannya menyesali apa yang telah ia belanjakan, sementara kebunnya roboh bersama para penyangganya, dan ia berkata, “Aduhai, kiranya dahulu aku tidak mempersekutukan seorang pun dengan Tuhanku.” Tak ada golongan yang menolongnya selain Allah.<br><br>Maka, jamaah, apa yang kita pelajari? Ketika Allah memberi kita nikmat, ucapkanlah Masya Allah, laa quwwata illaa billaah. Itu dzikir yang menjaga nikmat. Dan jangan bandingkan hartamu dengan orang lain dengan sombong. Dalam Surat Al-Qalam, Allah juga menceritakan pemilik kebun yang bersumpah akan memetik hasilnya di pagi hari agar orang miskin tidak ikut menikmati, tanpa mengucap insya Allah. Kebun mereka dibinasakan di malam hari, dan mereka menyesal. Kikir dan sombong menghilangkan berkah.','QS. Al-Kahfi: 32–44; QS. Al-Qalam: 17–33','مَا شَاءَ اللَّهُ لَا قُوَّةَ إِلَّا بِاللَّهِ','Maa syaa-allaahu laa quwwata illaa billaah.','“Sungguh, atas kehendak Allah (semua ini terwujud); tidak ada kekuatan kecuali dengan pertolongan Allah.” (QS. Al-Kahfi: 39)']});
