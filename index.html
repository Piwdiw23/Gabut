Object.assign(N,{'Maryam dan Rezeki dari Allah':['Maryam: Rezeki dari Allah dan Pohon Kurma yang Digoyang','q','Jamaah sekalian, kisah Maryam binti Imran dimulai dari doa seorang ibu. Istri Imran bernazar akan mempersembahkan anak dalam kandungannya untuk berkhidmat kepada Allah. Ketika yang lahir ternyata perempuan, ia berkata dengan jujur kepada Allah, “Ya Tuhanku, aku melahirkan seorang anak perempuan,” lalu menamainya Maryam dan memohonkan perlindungan Allah bagi dirinya dan keturunannya dari setan yang terkutuk. Allah menerima Maryam dengan penerimaan yang baik dan menumbuhkannya dengan pertumbuhan yang baik.<br><br>Maryam diasuh oleh Nabi Zakariya ’alaihissalam. Ia tinggal beribadah di mihrab. Dan setiap kali Zakariya masuk menjenguknya, ia mendapati makanan di sisi Maryam. Zakariya heran dan bertanya, “Wahai Maryam, dari mana engkau memperoleh makanan ini?” Jawaban Maryam sangat singkat dan penuh iman: “Dia (makanan itu) dari sisi Allah. Sungguh, Allah memberi rezeki kepada siapa yang Dia kehendaki tanpa perhitungan.” Melihat itu, hati Zakariya yang sudah lanjut usia pun tergerak. Di tempat itu juga ia berdoa, “Ya Tuhanku, berilah aku dari sisi-Mu keturunan yang baik. Sungguh, Engkau Maha Mendengar doa.”<br><br>Sekarang lompat ke bagian yang sering terlewat. Ketika Maryam sedang hamil Isa dan merasakan sakit melahirkan, ia bersandar pada pangkal pohon kurma dalam keadaan sangat lelah dan bersedih. Ia berkata, “Alangkah baiknya aku mati sebelum ini.” Lalu Allah menghibur melalui suara yang menyeru: “Janganlah engkau bersedih, sungguh Tuhanmu telah menjadikan anak sungai di bawahmu. Dan goyanglah pangkal pohon kurma itu ke arahmu, niscaya ia akan menjatuhkan buah kurma yang masak kepadamu.”<br><br>Subhanallah. Perhatikan, jamaah. Allah Mahakuasa menjatuhkan kurma langsung ke mulut Maryam tanpa ia bergerak sedikit pun. Tetapi Allah memerintahkan, ‘goyanglah’. Padahal ia sedang lemah setelah melahirkan. Inilah sunnatullah: rezeki datang bersama sebab, walau sebabnya kecil. Maka kepada yang lemah, yang sedang lelah, atau yang merasa tidak berdaya: lakukan yang bisa kau lakukan, sekecil apa pun, dan serahkan sisanya kepada Allah.','QS. Ali Imran: 35–44; QS. Maryam: 16–26','وَهُزِّي إِلَيْكِ بِجِذْعِ النَّخْلَةِ تُسَاقِطْ عَلَيْكِ رُطَبًا جَنِيًّا','Wa huzzii ilaiki bijidz’in-nakhlati tusaaqith ’alaiki rutabang janiyyaa.','“Dan goyanglah pangkal pohon kurma itu ke arahmu, niscaya pohon itu akan menjatuhkan buah kurma yang masak kepadamu.” (QS. Maryam: 25)'],'Nabi Dawud AS: Makan dari Hasil Tangan Sendiri':['Nabi Dawud AS: Raja yang Bekerja dengan Tangannya','s','Jamaah sekalian, mari kita bicara tentang kehormatan bekerja. Nabi Dawud ’alaihissalam adalah seorang nabi dan raja. Allah menguatkan kerajaannya dan memberinya hikmah. Tetapi apa yang Allah sebut tentang beliau? Allah melunakkan besi untuknya. Besi yang keras itu menjadi lentur di tangannya, dan Allah memerintahkan, “Buatlah baju besi yang besar-besar dan ukurlah anyamannya, dan kerjakanlah kebajikan.” Dalam ayat lain Allah menyebutkan bahwa Dia mengajarinya membuat baju besi untuk melindungi kalian dari peperangan kalian, maka apakah kalian bersyukur?<br><br>Perhatikan. Seorang raja tetap menjadi pandai besi. Padahal ia bisa hidup dari perbendaharaan negara. Dan Rasulullah SAW menjelaskan dalam hadis sahih, “Tidak ada seorang pun yang makan makanan yang lebih baik daripada makan dari hasil kerja tangannya sendiri. Dan sesungguhnya Nabi Allah Dawud makan dari hasil kerja tangannya sendiri.”<br><br>Bukan hanya Dawud. Dalam hadis lain, Nabi SAW bersabda bahwa tidak ada seorang nabi pun yang diutus kecuali pernah menggembalakan kambing. Para sahabat bertanya, “Dan engkau juga?” Beliau menjawab, “Ya, dahulu aku menggembalakan kambing penduduk Makkah dengan upah beberapa qirath.” Subhanallah. Penghulu para nabi pernah menjadi penggembala upahan.<br><br>Dan Nabi SAW pun menegaskan, “Sungguh, seseorang yang mengambil talinya, lalu membawa seikat kayu bakar di punggungnya dan menjualnya, sehingga Allah menjaga wajahnya (dari meminta-minta), itu lebih baik baginya daripada meminta-minta kepada orang, baik mereka beri atau menolak.”<br><br>Bagaimana dengan ibadah Dawud? Nabi SAW menyebutnya sebagai ibadah yang paling dicintai Allah: puasa sehari dan berbuka sehari, dan tidur separuh malam, bangun sepertiganya, lalu tidur seperenamnya. Inilah rahasia Dawud: kerja keras di siang hari, ibadah yang konsisten di malam hari. Maka tidak ada pekerjaan halal yang hina di sisi Allah. Yang hina adalah meminta-minta padahal mampu bekerja.','QS. Saba’: 10–11; QS. Al-Anbiya’: 80; HR. Bukhari no. 2073, 2262, 1470, 1131','أَنِ اعْمَلْ سَابِغَاتٍ وَقَدِّرْ فِي السَّرْدِ وَاعْمَلُوا صَالِحًا','An i’mal saabighaatin wa qaddir fis-sardi wa’maluu shaalihaa.','“(Yaitu) buatlah baju besi yang besar-besar dan ukurlah anyamannya, dan kerjakanlah kebajikan.” (QS. Saba’: 11)'],'Rezeki Seperti Burung':['Rezeki Seperti Burung: Pergi Pagi, Pulang Kenyang','h','Jamaah sekalian, ini hadis yang pendek tetapi sangat dalam. Umar bin Khattab radhiyallahu ’anhu meriwayatkan bahwa ia mendengar Rasulullah SAW bersabda, “Seandainya kalian benar-benar bertawakal kepada Allah dengan tawakal yang sebenarnya, niscaya Dia akan memberi kalian rezeki sebagaimana Dia memberi rezeki kepada burung. Ia pergi di pagi hari dalam keadaan lapar, dan pulang di sore hari dalam keadaan kenyang.”<br><br>Coba kita renungkan satu per satu. Pertama, burung itu lapar. Tawakal tidak menghapus rasa lapar dan kebutuhan. Kedua, burung itu pergi. Ia tidak diam di sarang menunggu makanan jatuh dari langit. Ia terbang, mencari, memeriksa, kadang jauh. Ketiga, ia pulang kenyang. Allah yang memberi kenyang. Maka tawakal itu gabungan antara kaki yang melangkah dan hati yang bergantung kepada Allah.<br><br>Dan ini sesuai dengan firman Allah dalam Surat Al-Ankabut, “Berapa banyak makhluk bernyawa yang tidak membawa rezekinya sendiri. Allah-lah yang memberi rezeki kepadanya dan kepadamu. Dan Dia Maha Mendengar, Maha Mengetahui.” Dalam Surat Hud pun Allah menegaskan bahwa tidak ada satu pun makhluk melata di bumi melainkan Allah yang menanggung rezekinya.<br><br>Sekarang hadis pelengkapnya. Rasulullah SAW bersabda, “Wahai manusia, bertakwalah kepada Allah dan carilah rezeki dengan cara yang baik. Sesungguhnya tidak akan mati satu jiwa sebelum ia menyempurnakan rezekinya, walaupun datangnya lambat. Maka bertakwalah kepada Allah, carilah dengan cara yang baik: ambillah yang halal dan tinggalkan yang haram.”<br><br>Jadi jangan khawatir bila rezeki terasa lambat. Yang perlu kita jaga adalah caranya. Jangan sampai karena ingin cepat, kita menempuh yang haram, seperti riba, menipu, atau suap. Burung pun tidak merampas sarang burung lain. Ia pergi mencari dengan cara yang Allah tetapkan.','HR. Tirmidzi no. 2344; HR. Ibnu Majah no. 2144; QS. Al-Ankabut: 60; QS. Hud: 6','وَكَأَيِّن مِّن دَابَّةٍ لَّا تَحْمِلُ رِزْقَهَا اللَّهُ يَرْزُقُهَا وَإِيَّاكُمْ ۚ وَهُوَ السَّمِيعُ الْعَلِيمُ','Wa ka-ayyim min daabbatil laa tahmilu rizqahallaahu yarzuquhaa wa iyyaakum, wa huwas-samii’ul-’aliim.','“Dan berapa banyak makhluk bergerak yang bernyawa yang tidak (dapat) membawa (mengurus) rezekinya sendiri. Allah-lah yang memberi rezeki kepadanya dan kepadamu. Dan Dia Maha Mendengar, Maha Mengetahui.” (QS. Al-Ankabut: 60)'],'Abu Thalhah dan Kebun Bairuha’':['Abu Thalhah dan Kebun Bairuha’: Menginfakkan yang Paling Dicintai','s','Jamaah sekalian, Anas bin Malik radhiyallahu ’anhu menceritakan sosok ayah tirinya, Abu Thalhah Al-Anshari. Ia adalah orang Anshar yang paling banyak memiliki kebun kurma di Madinah. Dan di antara semua hartanya, yang paling ia cintai adalah sebuah kebun bernama Bairuha’. Letaknya menghadap masjid Nabawi. Rasulullah SAW sering masuk ke sana dan minum airnya yang jernih dan segar.<br><br>Lalu turunlah firman Allah, “Kamu tidak akan memperoleh kebajikan (yang sempurna) sebelum kamu menginfakkan sebagian harta yang kamu cintai.” Begitu mendengar ayat itu, Abu Thalhah segera bangkit menemui Rasulullah SAW dan berkata, “Ya Rasulullah, Allah Tabaraka wa Ta’ala berfirman, ‘Kamu tidak akan memperoleh kebajikan sebelum menginfakkan sebagian harta yang kamu cintai.’ Dan harta yang paling aku cintai adalah Bairuha’. Maka ia kusedekahkan untuk Allah. Aku mengharap kebaikan dan simpanannya di sisi Allah. Letakkanlah, ya Rasulullah, sebagaimana yang Allah tunjukkan kepadamu.”<br><br>Perhatikan, jamaah. Ia tidak menunggu lama, tidak berhitung, dan tidak menyedekahkan yang sisa atau yang sudah jelek. Ia memilih yang paling ia cintai. Rasulullah SAW bersabda, “Bakh! Itu harta yang menguntungkan, itu harta yang menguntungkan. Aku telah mendengar apa yang kau katakan, dan menurutku sebaiknya engkau bagikan kepada kerabat-kerabatmu.” Abu Thalhah menjawab, “Aku laksanakan, ya Rasulullah.” Maka ia membagikannya kepada kerabat dan anak-anak pamannya.<br><br>Ada dua pelajaran. Pertama, orang yang bersedekah dengan harta yang paling ia cintai sedang menukar yang fana dengan yang kekal. Kedua, perhatikan arahan Nabi: sedekah kepada kerabat bernilai ganda, sedekah dan silaturahmi. Maka kalau kita ingin bersedekah, mulailah dari keluarga dekat yang membutuhkan.','HR. Bukhari no. 1461; HR. Muslim no. 998; QS. Ali Imran: 92','لَن تَنَالُوا الْبِرَّ حَتَّىٰ تُنفِقُوا مِمَّا تُحِبُّونَ','Lan tanaalul-birra hattaa tunfiquu mimmaa tuhibbuun.','“Kamu tidak akan memperoleh kebajikan (yang sempurna) sebelum kamu menginfakkan sebagian harta yang kamu cintai.” (QS. Ali Imran: 92)'],'Utsman bin Affan dan Sumur Raumah':['Utsman bin Affan: Dermawan yang Menjadi Teladan','h','Jamaah sekalian, ketika kaum Muslimin hijrah ke Madinah, mereka mendapati air tawar sangat sulit. Satu-satunya sumur yang airnya segar adalah sumur Raumah, dan pemiliknya adalah seorang laki-laki Yahudi yang menjual airnya kepada kaum Muslimin. Rasulullah SAW bersabda, “Siapa yang membeli sumur Raumah lalu menjadikan embernya bersama ember kaum Muslimin, niscaya baginya (balasan) lebih baik daripada itu di surga.”<br><br>Siapa yang menyambut seruan itu? Utsman bin Affan radhiyallahu ’anhu. Ia membelinya dengan hartanya sendiri dan menjadikannya wakaf untuk kaum Muslimin. Sejak itu air Raumah mengalir untuk siapa saja, tanpa dibayar. Para ulama menyebut ini sebagai salah satu wakaf pertama dalam sejarah Islam.<br><br>Lalu datang peristiwa lain. Ketika Nabi SAW mempersiapkan pasukan menuju Tabuk, yang dikenal dengan Jaisyul ’Usrah (pasukan di masa sulit), Utsman menyumbang perlengkapan yang sangat besar, berupa ratusan unta lengkap dengan pelana dan pakaian-nya, ditambah uang dinar yang ia letakkan di pangkuan Nabi. Nabi SAW membolak-balik dinar itu sambil bersabda, “Tidak ada yang membahayakan Utsman apa pun yang ia lakukan setelah hari ini.”<br><br>Sekarang renungkan: Utsman adalah pedagang kaya. Tetapi kekayaannya tidak menjadikannya sombong. Ia justru menjadi alat bagi umat. Dan Nabi SAW pun memuji rasa malu dan kedermawanannya, sehingga disebutlah, malaikat pun malu kepadanya. Jamaah, harta yang paling berharga adalah yang kita alirkan untuk kemaslahatan umat: sumur, masjid, pendidikan, dan bantuan bagi yang kesulitan.','HR. Tirmidzi no. 3703, 3700, 3701; HR. An-Nasa’i no. 3608; HR. Muslim no. 2401 (dinilai hasan)'],'Anas bin Malik dan Doa Nabi':['Anas bin Malik: Doa Nabi untuk Pelayan Kecilnya','s','Jamaah sekalian, ketika Rasulullah SAW tiba di Madinah, seorang ibu bernama Ummu Sulaim menggandeng putranya yang masih kecil, Anas. Ia berkata, “Ya Rasulullah, ini Anas, pelayanmu. Doakanlah dia.” Anas pun menjadi pelayan Nabi selama sepuluh tahun. Dan bagaimana Nabi memperlakukannya? Anas sendiri bersaksi, “Aku melayani Nabi SAW selama sepuluh tahun. Demi Allah, beliau tidak pernah berkata ‘ah’ kepadaku, dan tidak pernah berkata, ‘Mengapa engkau melakukan ini?’ atau ‘Mengapa engkau tidak melakukan itu?’” Subhanallah, begitulah akhlak seorang pemimpin kepada pembantunya.<br><br>Lalu Nabi mendoakannya: “Ya Allah, perbanyaklah harta dan anaknya, dan berkahilah apa yang Engkau berikan kepadanya.” Perhatikan susunan doanya. Harta, anak, dan keberkahan. Yang terakhir adalah kuncinya. Banyak orang punya harta, tetapi tidak berkah: cepat habis, tidak membuat tenteram, dan tidak mendekatkan kepada Allah.<br><br>Apa buktinya doa itu terkabul? Anas bercerita di masa tuanya bahwa hartanya termasuk yang terbanyak di kalangan Anshar, dan anak cucunya lebih dari seratus orang. Dalam riwayat Tirmidzi, kebun kurmanya berbuah dua kali dalam setahun.<br><br>Hikmah yang bisa kita ambil: pertama, lihat adab Ummu Sulaim. Ia tidak memberikan hadiah mahal untuk Nabi. Yang ia berikan adalah putranya yang masih kecil, untuk berkhidmat dan belajar. Kedua, orang tua yang memilihkan lingkungan baik bagi anaknya sedang menanam investasi terbesar. Ketiga, kita boleh meminta kepada Allah harta, anak, dan berkah, tetapi mintalah dengan urutan yang benar, dan jangan lupa meminta berkahnya.','HR. Bukhari no. 6334, 6344, 6038; HR. Muslim no. 2480, 2309; HR. Tirmidzi no. 3833 (hasan)','اللَّهُمَّ أَكْثِرْ مَالَهُ وَوَلَدَهُ، وَبَارِكْ لَهُ فِيمَا أَعْطَيْتَهُ','Allahumma ak-tsir maalahuu wa waladahuu, wa baarik lahuu fiimaa a’thaitah.','“Ya Allah, perbanyaklah hartanya dan anaknya, serta berkahilah apa yang Engkau berikan kepadanya.”'],'Abu Bakar dan Umar: Berlomba dalam Infak':['Abu Bakar dan Umar: Berlomba dalam Kebaikan','h','Jamaah sekalian, kisah ini dituturkan sendiri oleh Umar bin Khattab radhiyallahu ’anhu. Beliau berkata, “Rasulullah SAW memerintahkan kami untuk bersedekah, dan kebetulan saat itu aku sedang memiliki harta. Aku berkata dalam hati, hari ini aku akan mengalahkan Abu Bakar, jika suatu hari aku bisa mengalahkannya.” Maka Umar datang membawa separuh hartanya. Rasulullah SAW bertanya, “Apa yang engkau tinggalkan untuk keluargamu?” Umar menjawab, “Semisalnya.”<br><br>Tak lama kemudian datanglah Abu Bakar membawa seluruh hartanya. Nabi bertanya pertanyaan yang sama, “Apa yang engkau tinggalkan untuk keluargamu, wahai Abu Bakar?” Dan inilah jawaban yang membuat bulu kuduk berdiri: “Aku tinggalkan untuk mereka Allah dan Rasul-Nya.” Umar pun berkata, “Aku tidak akan pernah mengalahkanmu dalam hal apa pun.”<br><br>Subhanallah. Dua sahabat terbaik, berlomba bukan dalam kekayaan, tetapi dalam kebaikan. Dan ini yang dicintai Allah: persaingan yang sehat. Allah berfirman, “Maka berlomba-lombalah kamu dalam kebaikan.”<br><br>Tetapi jamaah, perhatikan keseimbangannya. Tidak semua orang diminta menyedekahkan seluruh hartanya. Abu Bakar adalah pengecualian dengan kekuatan imannya yang luar biasa. Kepada Sa’d bin Abi Waqqash yang ingin menyedekahkan seluruh hartanya ketika sakit, Nabi SAW melarang, lalu sepertiga pun disebut banyak. Beliau bersabda, “Engkau meninggalkan ahli warismu dalam keadaan berkecukupan lebih baik daripada engkau meninggalkan mereka dalam keadaan miskin meminta-minta kepada orang.”<br><br>Maka ukurlah diri. Bersedekahlah sesuai kemampuan, jangan sampai menelantarkan nafkah keluarga dan jangan sampai kita sendiri terjerumus pada utang. Dan bila Allah memberi kekuatan iman seperti Abu Bakar, itu karunia-Nya.','HR. Tirmidzi no. 3675; HR. Abu Dawud no. 1678; HR. Bukhari no. 1295; HR. Muslim no. 1628'],'Fuqara Muhajirin dan Dzikir Setelah Sholat':['Fuqara Muhajirin: Ketika Orang Miskin Menyusul Orang Kaya','s','Jamaah sekalian, hadis ini sangat menghibur bagi saudara-saudara kita yang kekurangan. Abu Hurairah radhiyallahu ’anhu menceritakan bahwa beberapa sahabat miskin dari Muhajirin datang kepada Rasulullah SAW dan berkata, “Ya Rasulullah, orang-orang kaya telah memperoleh derajat yang tinggi dan kenikmatan yang kekal. Mereka sholat seperti kami sholat, berpuasa seperti kami berpuasa, tetapi mereka memiliki kelebihan harta, sehingga mereka berhaji, berumrah, berjihad, dan bersedekah.”<br><br>Perhatikan: mereka tidak iri dalam arti dengki. Mereka tidak ingin hilangnya nikmat dari orang kaya. Mereka hanya ingin ikut meraih pahala yang sama. Maka bagaimana jawaban Nabi? Beliau bersabda, “Maukah kuajarkan kepada kalian sesuatu yang bila kalian amalkan, kalian akan menyusul orang yang mendahului kalian, dan tidak ada seorang pun yang lebih baik dari kalian kecuali orang yang melakukan seperti yang kalian lakukan?” “Mau, ya Rasulullah.” “Bertasbihlah, bertahmidlah, dan bertakbirlah, tiga puluh tiga kali setiap selesai sholat.”<br><br>Mereka pun mengamalkannya. Tidak lama kemudian mereka kembali dan berkata, “Saudara-saudara kami yang kaya telah mendengar apa yang kami lakukan, dan mereka melakukan hal yang sama.” Lalu Nabi SAW bersabda, “Itu karunia Allah, Dia berikan kepada siapa yang Dia kehendaki.” Subhanallah, orang kaya pun mendengar dan mengamalkan, tidak ada hasad di antara mereka.<br><br>Ada hadis penguat dari Abu Dzar. Para sahabat miskin pernah berkata serupa, lalu Nabi bersabda, “Bukankah Allah telah menjadikan untuk kalian sesuatu yang bisa kalian sedekahkan? Setiap tasbih adalah sedekah, setiap takbir adalah sedekah, setiap tahmid adalah sedekah, setiap tahlil adalah sedekah, memerintahkan kebaikan adalah sedekah, dan mencegah kemungkaran adalah sedekah.” Dan pada hadis lain, setiap persendian manusia wajib bersedekah setiap pagi, dan dua rakaat Dhuha mencukupinya.<br><br>Maka jangan pernah merasa miskin amal. Dzikir yang ringan di lidah, bila konsisten, bisa menyaingi sedekah harta. Cara praktisnya, setelah salam sholat fardhu: tasbih 33x, tahmid 33x, takbir 33x (atau takbir 34x sebagai genap seratus), lalu tahlil.','HR. Bukhari no. 843; HR. Muslim no. 595; HR. Muslim no. 1006, 720','سُبْحَانَ اللَّهِ (٣٣) الْحَمْدُ لِلَّهِ (٣٣) اللَّهُ أَكْبَرُ (٣٣) <br>لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ','Subhaanallaah (33x), Alhamdulillaah (33x), Allaahu akbar (33x). Laa ilaaha illallaahu wahdahuu laa syariika lah, lahul-mulku wa lahul-hamdu wa huwa ’alaa kulli syai-in qadiir.','Mahasuci Allah, segala puji bagi Allah, Allah Mahabesar. Tiada Tuhan selain Allah semata, tiada sekutu bagi-Nya; milik-Nya kerajaan dan pujian, dan Dia Mahakuasa atas segala sesuatu.']});
Object.assign(N,{'Nabi Yusuf AS: Menyimpan di Masa Lapang':['Nabi Yusuf AS: Dari Dasar Sumur Menjadi Bendahara Mesir','q','Jamaah sekalian, kalau ada satu kisah dalam Al-Qur’an yang paling sering membuat hati bergetar, itulah kisah Nabi Yusuf. Allah sendiri menyebutnya ‘ahsanul qashash’, sebaik-baik kisah. Dan satu surat penuh, Surat Yusuf, dikhususkan untuk menceritakannya dari awal sampai akhir. Maka duduklah dengan tenang, karena kisah ini panjang, dan setiap babaknya mengandung pelajaran bagi orang yang sedang berjuang.<br><br>Semuanya bermula dari mimpi seorang anak. Yusuf berkata kepada ayahnya, Nabi Ya’qub, “Wahai ayahku, sungguh aku bermimpi melihat sebelas bintang, matahari, dan bulan; aku melihat semuanya sujud kepadaku.” Ya’qub, yang memahami arti mimpi itu, berpesan dengan penuh kasih, “Wahai anakku, jangan ceritakan mimpimu kepada saudara-saudaramu, nanti mereka membuat tipu daya terhadapmu. Sungguh setan adalah musuh yang nyata bagi manusia.”<br><br>Tetapi di antara saudara-saudaranya, kecemburuan sudah tumbuh. Mereka berkata, “Yusuf dan saudaranya lebih dicintai ayah daripada kita, padahal kita golongan yang kuat.” Maka mereka berunding. Ada yang usul membunuh Yusuf, ada yang usul membuangnya ke negeri jauh. Salah satu dari mereka berkata, “Jangan bunuh dia, tetapi masukkan ke dasar sumur agar dipungut oleh kafilah yang lewat.” Lalu mereka membujuk ayahnya agar mengizinkan Yusuf bermain bersama mereka. Ya’qub khawatir Yusuf dimakan serigala saat mereka lengah. Namun akhirnya ia melepasnya. Dan ketika mereka telah membawanya dan sepakat memasukkannya ke dalam sumur, Allah mewahyukan kepada Yusuf, “Sungguh, kelak engkau akan menceritakan perbuatan mereka ini kepada mereka, sedang mereka tidak menyadarinya.”<br><br>Mereka pulang di waktu isya sambil menangis, membawa baju Yusuf yang dilumuri darah palsu. Ya’qub tidak percaya, dan ia menjawab dengan kalimat yang selalu diulang para penyabar: “Fa shabrun jamil, maka bersabar itu yang terbaik.” Sementara itu, sebuah kafilah datang, pencari air menurunkan timbanya, dan terkejut: seorang anak laki-laki. Mereka menjualnya dengan harga murah, beberapa dirham saja. Allah berfirman bahwa mereka tidak menghargainya.<br><br>Yusuf dibeli oleh seorang pembesar Mesir, yang berkata kepada istrinya, “Berilah dia tempat yang baik, mudah-mudahan dia bermanfaat bagi kita, atau kita angkat dia sebagai anak.” Demikianlah Allah menempatkannya di negeri itu. Ketika dewasa, Allah menganugerahkan hikmah dan ilmu. Lalu datanglah ujian yang lebih berat dari sumur: istri pembesar itu menggodanya, menutup pintu-pintu, dan berkata, “Marilah.” Yusuf menjawab dengan kalimat yang harus kita hafal sebagai benteng: “Ma’adzallah, aku berlindung kepada Allah. Sungguh, dia (suamimu) adalah tuanku yang telah memperlakukan aku dengan baik. Sungguh, orang-orang zalim tidak akan beruntung.” Ia lari menuju pintu, dan bajunya robek dari belakang. Kebenaran akhirnya terungkap, tetapi karena fitnah dan gosip, Yusuf justru dimasukkan ke dalam penjara.<br><br>Perhatikan doanya: “Ya Tuhanku, penjara lebih aku sukai daripada apa yang mereka ajak aku kepadanya. Dan jika Engkau tidak menghindarkan tipu daya mereka dariku, tentu aku akan cenderung kepada mereka.” Ia lebih memilih penjara daripada maksiat. Dan di dalam penjara, ia tidak mengeluh. Ia berdakwah. Kepada dua pemuda yang bermimpi, ia berkata, “Wahai kedua penghuni penjara, manakah yang lebih baik: tuhan-tuhan yang bermacam-macam ataukah Allah Yang Maha Esa lagi Mahaperkasa?” Ia menakwilkan mimpi keduanya: yang pertama akan menjadi juru minum raja, yang kedua akan disalib. Kepada yang selamat ia berpesan, “Sebutkanlah aku kepada tuanmu.” Tetapi setan membuatnya lupa, sehingga Yusuf tinggal di penjara beberapa tahun lagi.<br><br>Hingga suatu hari raja Mesir bermimpi: tujuh sapi gemuk dimakan tujuh sapi kurus, dan tujuh bulir gandum hijau serta tujuh yang kering. Para pembesar tak mampu menakwilkannya. Barulah pemuda yang dulu selamat teringat dan berkata, “Utuslah aku kepadanya.” Yusuf menjawab: akan datang tujuh tahun berturut-turut kalian bercocok tanam, maka biarkan hasilnya di tangkainya kecuali sedikit untuk dimakan. Sesudah itu datang tujuh tahun paceklik yang menghabiskan simpanan, kecuali sedikit yang kalian jaga. Kemudian datang tahun yang penuh hujan dan manusia memeras (hasil panen).<br><br>Raja takjub dan berkata, “Bawalah dia kepadaku.” Tetapi lihat kemuliaan Yusuf: ia menolak keluar penjara sebelum namanya dibersihkan. Setelah para wanita mengakui dan istri pembesar itu berkata, “Sekarang jelaslah kebenaran; akulah yang menggodanya, dan dia termasuk orang yang benar,” Yusuf pun dihadapkan. Raja berkata, “Hari ini engkau di sisi kami adalah orang yang berkedudukan tinggi lagi dipercaya.” Yusuf menjawab dengan tawaran yang jelas, “Jadikanlah aku bendahara negeri ini. Sungguh aku pandai menjaga lagi berpengetahuan.” Allah berfirman, “Demikianlah Kami memberi kedudukan kepada Yusuf di negeri itu.”<br><br>Ketika paceklik melanda, saudara-saudaranya datang membeli makanan dari Mesir. Yusuf mengenali mereka, tetapi mereka tidak mengenalinya. Singkat cerita, setelah ujian demi ujian, mereka mengakui kesalahan, dan Yusuf memaafkan dengan kalimat yang abadi: “Tidak ada cercaan terhadap kalian pada hari ini; semoga Allah mengampuni kalian.” Mimpi masa kecilnya terwujud ketika orang tua dan saudara-saudaranya datang dan bersujud penghormatan kepadanya. Dan di puncak kekuasaannya, Yusuf tidak sombong. Ia berdoa agar diwafatkan dalam keadaan muslim dan dikumpulkan bersama orang-orang saleh.<br><br>Jamaah, apa pelajarannya untuk rezeki dan kehidupan kita? Pertama, kekayaan atau kedudukan tidak selalu datang cepat. Yusuf melewati sumur, perbudakan, fitnah, dan penjara. Kedua, menjaga diri dari yang haram, bahkan dengan risiko penjara, akhirnya mengangkat kedudukan. Ketiga, keahlian dan perencanaan: menyimpan di masa lapang adalah bagian dari tawakal. Keempat, orang yang sabar tidak menyimpan dendam.','QS. Yusuf: 4–101','قَالَ اجْعَلْنِي عَلَىٰ خَزَائِنِ الْأَرْضِ ۖ إِنِّي حَفِيظٌ عَلِيمٌ<br>رَبِّ قَدْ آتَيْتَنِي مِنَ الْمُلْكِ وَعَلَّمْتَنِي مِن تَأْوِيلِ الْأَحَادِيثِ ۚ فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ أَنتَ وَلِيِّ فِي الدُّنْيَا وَالْآخِرَةِ ۖ تَوَفَّنِي مُسْلِمًا وَأَلْحِقْنِي بِالصَّالِحِينَ','Qaalaj’alnii ’alaa khazaa-inil-ardh, innii hafiizhun ’aliim. / Rabbi qad aataitanii minal-mulki wa ’allamtanii min ta’wiilil-ahaadiits, faathiras-samaawaati wal-ardh, anta waliyyii fid-dunyaa wal-aakhirah, tawaffanii muslimaw wa alhiqnii bish-shaalihiin.','“Jadikanlah aku bendahara negeri (Mesir), sungguh aku pandai menjaga lagi berpengetahuan.” (QS. Yusuf: 55) / “Ya Tuhanku, sungguh Engkau telah menganugerahkan kepadaku sebagian kekuasaan dan mengajarkan kepadaku sebagian takwil mimpi. (Wahai Tuhan) pencipta langit dan bumi, Engkaulah pelindungku di dunia dan akhirat, wafatkanlah aku dalam keadaan muslim dan gabungkanlah aku dengan orang-orang saleh.” (QS. Yusuf: 101)'],'Nabi Musa AS di Madyan':['Nabi Musa AS: Dari Sungai Nil Hingga Mata Air Madyan','q','Jamaah sekalian, kisah Nabi Musa ’alaihissalam adalah kisah yang paling banyak diulang dalam Al-Qur’an. Mari kita ikuti dari awal, karena setiap babaknya memperlihatkan bagaimana Allah mengatur rezeki dan keselamatan hamba-Nya dengan cara yang tak pernah kita sangka.<br><br>Allah menceritakan bahwa Fir’aun berlaku sombong di muka bumi. Ia memecah belah rakyatnya, menindas Bani Israil, menyembelih anak laki-laki mereka, dan membiarkan hidup anak perempuan. Pada masa itulah Musa dilahirkan. Dan Allah mewahyukan kepada ibunya, “Susuilah dia, dan apabila engkau khawatir terhadapnya, hanyutkanlah dia ke sungai (Nil), dan jangan takut dan jangan bersedih hati, sungguh Kami akan mengembalikannya kepadamu dan menjadikannya salah seorang rasul.”<br><br>Bayangkan perasaan seorang ibu. Ia meletakkan bayinya di dalam peti dan melepasnya ke sungai. Ia mengikuti perintah Allah dengan hati yang remuk. Lalu keluarga Fir’aun memungutnya. Dan perhatikan siapa yang melindunginya: istri Fir’aun berkata, “Dia penyejuk mata bagiku dan bagimu, jangan kamu membunuhnya, mudah-mudahan dia bermanfaat bagi kita.” Subhanallah, bayi yang kelak menumbangkan Fir’aun dibesarkan di istana Fir’aun sendiri. Sementara itu hati ibu Musa menjadi kosong, nyaris ia menyatakan rahasia itu jika Allah tidak meneguhkan hatinya. Ia menyuruh saudara perempuan Musa mengikuti dari jauh. Musa menolak disusui oleh perempuan-perempuan lain, hingga saudara perempuannya berkata, “Maukah kalian kutunjukkan keluarga yang akan memeliharanya?” Maka Allah mengembalikannya kepada ibunya, agar tenang hatinya dan tidak bersedih, dan agar ia tahu bahwa janji Allah itu benar.<br><br>Ketika Musa dewasa, Allah memberinya hikmah dan ilmu. Suatu hari ia memasuki kota ketika penduduknya lengah, dan mendapati dua laki-laki berkelahi, satu dari golongannya dan satu dari musuhnya. Orang dari golongannya meminta tolong. Musa meninju musuh itu, dan orang itu mati. Seketika Musa sadar, “Ini termasuk perbuatan setan,” dan ia berdoa, “Ya Tuhanku, sungguh aku telah menzalimi diriku, maka ampunilah aku.” Allah pun mengampuninya.<br><br>Keesokan harinya, ketika ia melihat orang yang sama meminta tolong lagi, seorang laki-laki datang berlari dari ujung kota, “Wahai Musa, sesungguhnya para pembesar sedang berunding untuk membunuhmu, maka keluarlah dari sini.” Musa keluar dalam keadaan takut dan waspada, sambil berdoa, “Ya Tuhanku, selamatkanlah aku dari kaum yang zalim.” Ia menuju Madyan dengan harapan, “Mudah-mudahan Tuhanku menunjukkan kepadaku jalan yang benar.” Tanpa bekal, tanpa kendaraan, mungkin dengan kaki yang lecet dan perut kosong.<br><br>Sampai di mata air Madyan, ia melihat sekumpulan orang memberi minum ternaknya, dan di sisi lain dua perempuan yang menahan kambingnya. “Apa maksud kalian berdua?” “Kami tidak dapat memberi minum sebelum para penggembala itu pergi, dan ayah kami sudah sangat tua.” Tanpa pamrih Musa memberi minum ternak mereka, lalu berteduh di bawah naungan dan berdoa, “Ya Tuhanku, sungguh aku sangat memerlukan kebaikan apa pun yang Engkau turunkan kepadaku.”<br><br>Tak lama, salah satu dari kedua perempuan itu datang, berjalan dengan malu-malu: “Sesungguhnya ayahku memanggilmu untuk memberi balasan atas kebaikanmu memberi minum ternak kami.” Musa menemui ayah mereka dan menceritakan kisahnya, dan sang ayah menenangkan, “Jangan takut, engkau telah selamat dari kaum yang zalim.” Salah seorang putrinya berkata, “Wahai ayahku, pekerjakanlah dia, sungguh sebaik-baik orang yang engkau pekerjakan adalah yang kuat lagi dapat dipercaya.” Sang ayah menawarkan, “Aku ingin menikahkanmu dengan salah satu dari kedua putriku ini, dengan syarat engkau bekerja padaku delapan tahun, dan jika engkau genapkan sepuluh tahun, maka itu kebaikan darimu. Aku tidak ingin memberatkanmu.” Musa menjawab, “Itu perjanjian antara aku dan engkau. Mana pun dari dua waktu itu yang aku penuhi, tidak ada tuntutan atasku.”<br><br>Setelah menyelesaikan masa kerjanya, Musa berangkat membawa keluarganya. Di perjalanan, ia melihat api dari lereng gunung. Dan di sanalah, di lembah suci, Allah memanggilnya dan mengangkatnya sebagai rasul.<br><br>Jamaah, lihat rangkaiannya. Musa lahir dalam bahaya, dibesarkan di istana musuh, melarikan diri sebagai buronan, kelaparan di padang, lalu Allah beri ia pekerjaan, rumah tangga, dan akhirnya kenabian. Dan semuanya bermula dari seorang pemuda yang menolong tanpa pamrih dan jujur dalam bekerja. Catatan: Al-Qur’an tidak menyebut nama sang ayah. Sebagian ulama menyebutnya Syu’aib, tetapi tidak ada dalil sahih yang tegas, jadi cukup kita sebut ‘orang tua yang saleh di Madyan’.','QS. Al-Qasas: 4–30','رَبِّ إِنِّي لِمَا أَنزَلْتَ إِلَيَّ مِنْ خَيْرٍ فَقِيرٌ','Rabbi innii limaa anzalta ilayya min khairin faqiir.','“Ya Tuhanku, sungguh aku sangat memerlukan sesuatu kebaikan yang Engkau turunkan kepadaku.” (QS. Al-Qasas: 24)'],'Abdurrahman bin Auf: Kaya dari Pasar':['Abdurrahman bin Auf: Dermawan yang Kaya dari Pasar','s','Jamaah sekalian, mari kita mulai dengan satu pertanyaan yang sering muncul di hati orang yang sedang sempit: bolehkah seorang muslim menjadi kaya? Dan kalau boleh, seperti apa kekayaan yang selamat? Jawabannya ada pada seorang sahabat Rasulullah SAW yang dikenal sebagai saudagar kaya sekaligus dijamin surga: Abdurrahman bin Auf radhiyallahu ’anhu.<br><br>Abdurrahman masuk Islam di awal dakwah, dan ia termasuk yang berhijrah dua kali: ke Habasyah dan kemudian ke Madinah. Ia meninggalkan Makkah dengan hampir tak membawa apa-apa. Rumah, harta, dan dagangannya tertinggal. Bayangkan kegelisahan seorang pedagang yang tiba di kota baru tanpa modal. Tetapi lihat bagaimana ia menyikapinya.<br><br>Ketika Rasulullah SAW mempersaudarakan Muhajirin dan Anshar, Abdurrahman dipersaudarakan dengan Sa’ad bin Ar-Rabi’, seorang Anshar yang kaya. Sa’ad berkata, “Saudaraku, aku orang Anshar yang paling banyak hartanya. Ambillah separuh hartaku. Dan aku punya dua istri, lihatlah mana yang engkau suka, akan kuceraikan, dan setelah masa iddahnya engkau nikahi.” Subhanallah. Siapa yang mau berbagi sampai sejauh itu? Itulah akhlak orang Anshar, yang Allah puji dalam Surat Al-Hasyr karena mereka mencintai orang yang berhijrah kepada mereka dan mengutamakan orang lain atas diri sendiri.<br><br>Namun Abdurrahman, dengan harga diri seorang mukmin, menjawab, “Semoga Allah memberkahimu pada keluarga dan hartamu. Tunjukkan saja kepadaku di mana pasar.” Ia tidak mau menerima belas kasihan. Ia ingin bekerja. Maka berangkatlah ia ke pasar, berjual beli, dan beberapa hari kemudian pulang dengan keuntungan berupa keju dan samin.<br><br>Usahanya terus berkembang. Tak lama, Nabi SAW melihat bekas wewangian kuning pada pakaiannya dan bertanya, “Ada apa, wahai Abdurrahman?” “Aku menikahi seorang wanita Anshar.” “Berapa maharmu?” “Emas seberat biji kurma.” Maka Nabi mendoakan, “Semoga Allah memberkahimu. Adakanlah walimah walau dengan seekor kambing.”<br><br>Perhatikan doa itu: ‘Baarakallahu laka’, semoga Allah memberkahimu. Bukan ‘semoga kau kaya’, tetapi ‘semoga kau diberkahi’. Dan berkah itulah yang kemudian membuat usahanya tumbuh. Kelak ia menjadi salah satu sahabat terkaya, tetapi juga salah satu yang paling dermawan. Rasulullah SAW menyebutnya di antara sepuluh sahabat yang dikabarkan masuk surga.<br><br>Ada kisah lain yang menunjukkan betapa tinggi kedudukannya. Dalam perjalanan ke Tabuk, ketika Nabi SAW terlambat datang, para sahabat menunjuk Abdurrahman sebagai imam sholat Subuh. Ketika Nabi tiba dan melihat Abdurrahman mengimami, beliau tidak menyuruhnya mundur. Nabi sholat di belakangnya dan menyempurnakan rakaat yang tertinggal. Para ulama menjelaskan, ini kehormatan besar: Nabi sholat di belakang salah seorang umatnya.<br><br>Dan yang paling menyentuh: dalam hadis sahih, suatu hari Abdurrahman disuguhi makanan saat ia berpuasa. Ia berkata, “Mush’ab bin Umair gugur, dan ia lebih baik dariku. Ia dikafani dengan sehelai kain yang jika ditutupkan ke kepalanya terbuka kakinya, dan jika ditutup kakinya terbuka kepalanya. Hamzah pun gugur dan ia lebih baik dariku. Lalu dunia dihamparkan kepada kami dengan sangat luas. Aku khawatir pahala kebaikan kami dipercepat (di dunia).” Lalu ia menangis hingga meninggalkan makanannya.<br><br>Jamaah, di sinilah rahasianya. Orang yang kaya tetapi takut kekayaannya mengurangi pahala akhiratnya, itulah kekayaan yang selamat. Maka rumus kaya ala Abdurrahman bin Auf ada empat: tidak bergantung pada belas kasihan orang, bekerja jujur dengan jalan yang halal, hartanya dialirkan di jalan Allah, dan hatinya tetap takut kepada Allah. Mintalah kepada Allah, ‘tunjukkan aku pasar’, yaitu bukakan jalan kerja yang halal dan berkah.','HR. Bukhari no. 2048, 3780, 3781, 1274; HR. Muslim no. 274; HR. Tirmidzi no. 3747; QS. Al-Hasyr: 9','دُلُّونِي عَلَى السُّوقِ','Dulluunii ’alas-suuq.','“Tunjukkan aku jalan menuju pasar.”'],'Nabi Yunus AS: Doa dari Perut Ikan':['Nabi Yunus AS: Doa dari Tiga Kegelapan','q','Jamaah sekalian, kisah Nabi Yunus ’alaihissalam adalah kisah tentang kembali kepada Allah ketika semua jalan telah tertutup. Allah menyebutnya ‘Dzun Nun’ dan ‘Shahibul Hut’, pemilik ikan. Dan Allah menyebut dalam Surat Ash-Shaffat bahwa ia termasuk para rasul yang diutus kepada seratus ribu orang atau lebih. Para mufassir menyebut kaumnya adalah penduduk kota Ninawa. Nama kota itu tidak disebut dalam Al-Qur’an, tetapi itulah penjelasan para ulama tafsir.<br><br>Yunus berdakwah lama. Tetapi kaumnya tidak kunjung beriman. Hatinya sempit, dadanya sesak. Lalu Allah menceritakan dalam Surat Al-Anbiya’: “Dan (ingatlah kisah) Dzun Nun (Yunus), ketika ia pergi dalam keadaan marah, lalu ia menyangka bahwa Kami tidak akan menyulitkannya.” Maknanya, ia pergi meninggalkan kaumnya sebelum Allah mengizinkannya. Padahal seorang nabi harus tetap bersabar sampai ada perintah dari Allah. Karena itu, dalam Surat Al-Qalam, Allah berpesan kepada Nabi Muhammad SAW, “Bersabarlah engkau terhadap ketetapan Tuhanmu, dan janganlah engkau seperti orang yang berada dalam (perut) ikan, ketika ia berdoa dalam keadaan sangat sedih.”<br><br>Yunus menaiki sebuah kapal yang penuh muatan. Di tengah lautan, kapal itu terancam tenggelam. Para penumpang sepakat mengundi siapa yang harus dilempar ke laut agar kapal selamat. Yunus ikut mengundi, dan undian jatuh kepadanya. Dalam Surat Ash-Shaffat, Allah menyebut bahwa ia termasuk orang yang kalah dalam undian. Maka ia pun dilemparkan ke laut, lalu ditelan ikan besar dalam keadaan ia tercela, karena telah meninggalkan tugasnya.<br><br>Sekarang bayangkan, jamaah. Tiga lapis kegelapan: gelap malam, gelap kedalaman laut, dan gelap perut ikan. Tak ada manusia yang melihat, tak ada yang mendengar, tak ada yang bisa menolong. Dan inilah yang diucapkan Yunus. Bukan keluhan, bukan salah menyalahkan. Ia berseru, “Laa ilaaha illaa anta subhaanaka innii kuntu minazh-zhaalimiin, tidak ada Tuhan selain Engkau, Mahasuci Engkau, sungguh aku termasuk orang-orang yang zalim.” Ia mengakui tiga hal: tauhid (tidak ada Tuhan selain Allah), tasbih (Mahasuci Engkau), dan pengakuan dosa (aku termasuk orang yang zalim).<br><br>Allah menjawab, “Maka Kami kabulkan (doa)nya dan Kami selamatkan dia dari kedukaan. Dan demikianlah Kami menyelamatkan orang-orang yang beriman.” Dalam Surat Ash-Shaffat Allah juga berfirman bahwa seandainya ia bukan termasuk orang yang banyak bertasbih, niscaya ia akan tinggal di perut ikan itu sampai hari kebangkitan. Lihatlah betapa kebiasaan bertasbih di masa lapang menjadi penyelamat di masa sempit.<br><br>Maka Yunus dilemparkan ke daratan yang tandus dalam keadaan sakit. Allah menumbuhkan pohon yaqtin yang menaunginya. Dan kemudian ia kembali kepada kaumnya, seratus ribu atau lebih, dan kali ini mereka beriman, sehingga Allah memberi mereka kenikmatan hidup hingga waktu yang ditentukan.<br><br>Satu lagi pelajaran adab dari hadis sahih: Rasulullah SAW bersabda, “Tidak patut bagi seseorang mengatakan bahwa aku lebih baik daripada Yunus bin Matta.” Padahal Nabi Muhammad SAW penghulu para nabi, tetapi beliau mengajarkan kerendahan hati dan menghormati para nabi lainnya.<br><br>Dan hadis tentang doa Dzun Nun: Nabi SAW bersabda bahwa tidaklah seorang muslim berdoa dengan doa itu untuk suatu perkara, kecuali Allah mengabulkannya. Maka inilah pegangan kita ketika buntu, terlilit utang, atau tertimpa musibah: bertauhid, bertasbih, mengakui kesalahan, dan kembali kepada Allah.','QS. Al-Anbiya’: 87–88; QS. Ash-Shaffat: 139–148; QS. Al-Qalam: 48–50; HR. Tirmidzi no. 3505; HR. Bukhari no. 3416; HR. Muslim no. 2376','لَا إِلَٰهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ','Laa ilaaha illaa anta subhaanaka innii kuntu minazh-zhaalimiin.','“Tidak ada Tuhan selain Engkau, Mahasuci Engkau, sungguh aku termasuk orang-orang yang zalim.” (QS. Al-Anbiya’: 87)']});

var S2=[['Hajar dan Ismail: Berlari Mencari Air','s','Nabi Ibrahim AS membawa istrinya Hajar dan bayi mereka Ismail ke lembah Makkah yang saat itu tak berpenghuni, tanpa air dan tanaman. Ia menaruh mereka di dekat sebatang pohon, meninggalkan sekantong kurma dan wadah air, lalu berbalik pergi. Hajar mengikutinya sambil bertanya berulang kali, “Wahai Ibrahim, ke mana engkau pergi meninggalkan kami di lembah yang tak ada siapa pun dan apa pun?” Ibrahim diam. Akhirnya Hajar bertanya, “Apakah Allah yang memerintahkanmu ini?” Ibrahim menjawab, “Ya.” Hajar berkata, “Kalau begitu, Dia tidak akan menyia-nyiakan kami.”<br><br>Di bukit Tsaniyyah, Ibrahim menghadap Ka’bah dan berdoa dengan mengangkat tangan. Bekal habis, dan Ismail mulai menggeliat kehausan. Hajar tak tega melihatnya. Ia naik ke bukit Shafa mencari tanda adanya orang atau air, lalu turun dan berlari kecil di tengah lembah, naik ke Marwa, dan mengulanginya tujuh kali. Nabi SAW bersabda bahwa itulah asal sa’i di antara keduanya.<br><br>Di Marwa ia mendengar suara. Ia kembali ke Ismail dan melihat malaikat Jibril telah menggali tanah hingga air memancar. Hajar membendungnya dengan tangan sambil menyebutnya “zamzam”, lalu minum dan menyusui anaknya. Nabi SAW bersabda, “Semoga Allah merahmati ibu Ismail; andai ia membiarkan Zamzam, niscaya ia menjadi mata air yang mengalir.” Kemudian suku Jurhum melintas, melihat burung berputar di atas air, dan meminta izin tinggal. Hajar mengizinkan, dan Makkah pun menjadi kota.<br><br>Pelajaran: tawakal Hajar bukan diam. Ia pasrah kepada perintah Allah, namun tetap berlari mencari jalan. Allah menjawab dengan sumber rezeki yang bertahan hingga hari ini.','HR. Bukhari no. 3364; QS. Ibrahim: 37','فَاجْعَلْ أَفْئِدَةً مِّنَ النَّاسِ تَهْوِي إِلَيْهِمْ وَارْزُقْهُم مِّنَ الثَّمَرَاتِ لَعَلَّهُمْ يَشْكُرُونَ','Faj’al af-idatam minan-naasi tahwii ilaihim warzuqhum minats-tsamaraati la’allahum yasykuruun.','“Maka jadikanlah hati sebagian manusia condong kepada mereka dan berilah mereka rezeki dari buah-buahan, mudah-mudahan mereka bersyukur.” (QS. Ibrahim: 37)'],['Nabi Yunus AS: Doa dari Perut Ikan','q','Nabi Yunus AS diutus kepada penduduk Ninawa. Setelah lama berdakwah dan mereka tidak beriman, ia pergi meninggalkan mereka dalam keadaan marah sebelum Allah mengizinkannya (QS. Al-Anbiya’: 87). Ia menaiki kapal yang penuh muatan. Ketika kapal terancam tenggelam, para penumpang mengundi siapa yang harus dilempar ke laut, dan undian jatuh kepada Yunus. Ia pun dilempar, lalu ditelan ikan besar (QS. Ash-Shaffat: 139–142).<br><br>Dalam tiga kegelapan, yaitu gelap malam, gelap lautan, dan gelap perut ikan, Yunus menyeru Tuhannya dengan pengakuan: tak ada Tuhan selain Allah, Maha Suci Allah, dan ia termasuk orang yang zalim. Allah mengabulkannya dan menyelamatkannya dari kesedihan. Ia dilemparkan ke daratan dalam keadaan sakit, lalu Allah menumbuhkan pohon yaqtin untuk menaunginya (QS. Ash-Shaffat: 145–146). Kemudian ia kembali kepada kaumnya, seratus ribu orang atau lebih, dan mereka beriman sehingga Allah memberi mereka kenikmatan hidup hingga waktu tertentu (QS. Ash-Shaffat: 147–148).<br><br>Nabi SAW bersabda bahwa tidaklah seorang muslim berdoa dengan doa Dzun Nun (Yunus) ini untuk suatu perkara, kecuali Allah mengabulkannya. Pelajaran: ketika semua jalan tertutup, pengakuan dosa dan tasbih adalah pintu pertama menuju jalan keluar.','QS. Al-Anbiya’: 87–88; QS. Ash-Shaffat: 139–148; HR. Tirmidzi no. 3505','لَا إِلَٰهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ','Laa ilaaha illaa anta subhaanaka innii kuntu minazh-zhaalimiin.','“Tidak ada Tuhan selain Engkau, Mahasuci Engkau, sungguh aku termasuk orang-orang yang zalim.” (QS. Al-Anbiya’: 87)'],['Nabi Dawud AS: Makan dari Hasil Tangan Sendiri','s','Nabi Dawud AS adalah seorang raja sekaligus nabi, namun ia tetap bekerja dengan tangannya. Allah melunakkan besi baginya dan mengajarinya membuat baju besi yang rapi dan terukur anyamannya, sehingga melindungi manusia dalam peperangan (QS. Saba’: 10–11; QS. Al-Anbiya’: 80). Dalam Al-Qur’an Allah menyertakan perintah beramal saleh setelah menyebut keahlian itu.<br><br>Nabi SAW bersabda dalam hadis sahih: “Tidak ada seorang pun makan makanan yang lebih baik daripada makan dari hasil kerja tangannya sendiri, dan sesungguhnya Nabi Allah Dawud makan dari hasil kerja tangannya.” Dalam hadis lain beliau menegaskan bahwa seseorang yang pergi memikul seikat kayu bakar di punggungnya lalu menjualnya, itu lebih baik daripada meminta-minta kepada orang, diberi atau ditolak.<br><br>Pelajaran: keahlian, kerja keras, dan kejujuran dalam bekerja adalah jalan rezeki yang dicontohkan para nabi. Tidak ada kerja halal yang rendah di mata Allah.','QS. Saba’: 10–11; HR. Bukhari no. 2072, 2073, 1470','أَنِ اعْمَلْ سَابِغَاتٍ وَقَدِّرْ فِي السَّرْدِ وَاعْمَلُوا صَالِحًا','An i’mal saabighaatin wa qaddir fis-sardi wa’maluu shaalihaa.','“(Yaitu) buatlah baju besi yang besar-besar dan ukurlah anyamannya, dan kerjakanlah kebajikan.” (QS. Saba’: 11)'],['Abu Hurairah dan Semangkuk Susu','s','Abu Hurairah RA, sahabat yang tinggal bersama ahlus suffah di serambi masjid, bercerita bahwa dahulu ia menempelkan perutnya ke tanah dan mengikat batu di perutnya karena lapar. Suatu hari ia duduk di jalan yang dilalui para sahabat dan menanyakan sebuah ayat kepada Abu Bakar, berharap diajak makan, namun tak terjadi. Begitu pula dengan Umar.<br><br>Kemudian Nabi SAW lewat. Beliau tersenyum karena tahu keadaannya, memanggil, “Abu Hirr,” lalu berkata, “Ikutlah.” Di rumah beliau ada semangkuk susu hadiah dari seseorang. Nabi menyuruh Abu Hurairah memanggil seluruh ahlus suffah. Hatinya sempat bimbang: susu sedikit, tapi ia yang diperintah membagikan. Satu per satu mereka minum hingga puas, sampai semua kenyang, lalu Nabi menyuruh Abu Hurairah minum, lalu minum lagi, hingga ia berkata tak ada tempat lagi untuk minum. Barulah Nabi sendiri meminum sisanya.<br><br>Pelajaran: Allah dapat mencukupkan yang sedikit ketika dibagikan dengan adab dan kebersamaan. Dan orang yang paling dahulu merasakan kenyang adalah yang paling lapar.','HR. Bukhari no. 6452'],['Abu Bakar dan Umar: Berlomba dalam Infak','h','Umar bin Khattab RA bercerita bahwa suatu hari Nabi SAW memerintahkan para sahabat bersedekah, dan kebetulan ia sedang memiliki harta. Ia berkata dalam hati, “Hari ini aku akan mengalahkan Abu Bakar.” Ia membawa separuh hartanya. Nabi bertanya, “Apa yang kau tinggalkan untuk keluargamu?” Umar menjawab, “Semisalnya.”<br><br>Abu Bakar datang membawa seluruh hartanya. Nabi bertanya hal yang sama, dan Abu Bakar menjawab, “Aku tinggalkan untuk mereka Allah dan Rasul-Nya.” Umar berkata, “Aku tidak akan pernah mengalahkanmu dalam apa pun.” Pelajaran: kekuatan iman Abu Bakar, dan pentingnya berlomba dalam kebaikan. Namun bagi kebanyakan orang, sedekah tetap dilakukan dalam kadar kemampuan dan tidak menelantarkan nafkah keluarga, sebagaimana Nabi bertanya kepada kedua sahabat itu tentang bekal keluarga.','HR. Tirmidzi no. 3675; HR. Abu Dawud no. 1678 (hasan)'],['Fuqara Muhajirin dan Dzikir Setelah Sholat','s','Sejumlah sahabat miskin dari kaum Muhajirin datang kepada Nabi SAW dan mengeluh, “Orang-orang kaya telah mendapat derajat tinggi dan kenikmatan abadi. Mereka sholat seperti kami, berpuasa seperti kami, tetapi mereka punya kelebihan harta sehingga bisa berhaji, berumrah, berjihad, dan bersedekah.”<br><br>Nabi SAW bersabda, “Maukah kuajarkan sesuatu yang jika kalian lakukan, kalian akan menyusul orang yang mendahului kalian, dan tak seorang pun lebih baik dari kalian kecuali yang melakukan seperti kalian? Bertasbihlah, bertahmidlah, dan bertakbirlah tiga puluh tiga kali setiap selesai sholat.” Mereka pun mengamalkan. Tak lama, mereka kembali dan berkata bahwa saudara-saudara mereka yang kaya telah mendengar dan melakukan hal yang sama. Nabi SAW bersabda, “Itu karunia Allah, Dia berikan kepada siapa yang Dia kehendaki.”<br><br>Cara: setelah salam, baca tasbih 33x, tahmid 33x, takbir 33x (atau takbir 34x untuk menggenapkan seratus), kemudian tahlil. Pelajaran: orang yang tidak punya banyak harta tidak kehilangan peluang meraih derajat tinggi; ibadah lisan yang ringan namun konsisten sangat bernilai.','HR. Bukhari no. 843; HR. Muslim no. 595','سُبْحَانَ اللَّهِ (٣٣) الْحَمْدُ لِلَّهِ (٣٣) اللَّهُ أَكْبَرُ (٣٣) <br>لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ','Subhaanallaah (33x), Alhamdulillaah (33x), Allaahu akbar (33x). Laa ilaaha illallaahu wahdahuu laa syariika lah, lahul-mulku wa lahul-hamdu wa huwa ’alaa kulli syai-in qadiir.','Mahasuci Allah, segala puji bagi Allah, Allah Mahabesar. Tiada Tuhan selain Allah semata, tiada sekutu bagi-Nya; milik-Nya kerajaan dan pujian, dan Dia Mahakuasa atas segala sesuatu.'],['Fatimah, Ali, dan Dzikir Sebelum Tidur','s','Fatimah RA, putri Nabi SAW, menggiling gandum dengan tangannya sampai kapalan, dan Ali RA mengangkut air hingga letih. Ketika Nabi mendapat tawanan perang, Fatimah pergi menemui ayahnya untuk meminta seorang pembantu, namun Nabi tidak ada di rumah, sehingga ia menitipkan pesan kepada Aisyah.<br><br>Malam harinya Nabi datang ke rumah mereka ketika keduanya sudah berbaring. Mereka hendak bangun, tetapi Nabi berkata agar mereka tetap di tempat. Beliau duduk di antara mereka dan bersabda, “Maukah kuajarkan yang lebih baik daripada apa yang kalian minta? Apabila kalian hendak tidur, bertasbihlah tiga puluh tiga kali, bertahmidlah tiga puluh tiga kali, dan bertakbirlah tiga puluh empat kali. Itu lebih baik bagi kalian daripada seorang pembantu.” Ali RA berkata kemudian bahwa ia tidak pernah meninggalkannya sejak ia mendengar dari Nabi SAW, bahkan di malam perang Shiffin.<br><br>Pelajaran: rumah tangga yang hidup sederhana dapat dipenuhi kekuatan oleh dzikir, tanpa mengabaikan usaha bekerja. Para ulama menyebut dzikir ini membantu menguatkan badan dan menghilangkan lelah.','HR. Bukhari no. 3113, 5361; HR. Muslim no. 2727','سُبْحَانَ اللَّهِ (٣٣) الْحَمْدُ لِلَّهِ (٣٣) اللَّهُ أَكْبَرُ (٣٤)','Subhaanallaah (33x), Alhamdulillaah (33x), Allaahu akbar (34x).','Mahasuci Allah, segala puji bagi Allah, Allah Mahabesar.'],['Ashabul Kahfi: Pemuda yang Dijaga Allah','q','Sekelompok pemuda beriman hidup di tengah kaum yang menyembah selain Allah. Karena takut dipaksa meninggalkan agama, mereka lari ke sebuah gua dan berdoa memohon rahmat dan petunjuk (QS. Al-Kahfi: 9–16). Allah menutup telinga mereka di dalam gua selama bertahun-tahun, dan menjaga tubuh mereka. Al-Qur’an menyebut lama tidur mereka tiga ratus tahun ditambah sembilan (QS. Al-Kahfi: 25).<br><br>Ketika bangun, mereka mengira hanya tertidur sehari atau separuh hari. Mereka lapar, lalu mengutus salah satu dari mereka membawa uang perak ke kota. Pesannya jelas: carilah makanan yang paling bersih (halal), bawalah sebagian untuk kita, dan berhati-hatilah, jangan sampai ada yang mengetahui keadaan kita (QS. Al-Kahfi: 19). Namun uang yang ia bawa sudah tak berlaku, sehingga keberadaan mereka terungkap, dan orang-orang kota yang telah beriman mengetahui kisah mereka.<br><br>Pelajaran: bahkan saat dalam pelarian dan lapar, mereka menjaga kehalalan makanan. Doa mereka sederhana namun lengkap, dan Allah memberi lebih dari yang mereka minta.','QS. Al-Kahfi: 9–26','رَبَّنَا آتِنَا مِن لَّدُنكَ رَحْمَةً وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًا','Rabbanaa aatinaa min ladunka rahmatan wa hayyi’ lanaa min amrinaa rasyadaa.','“Ya Tuhan kami, berilah kami rahmat dari sisi-Mu dan sempurnakanlah bagi kami petunjuk yang lurus dalam urusan kami.” (QS. Al-Kahfi: 10)']];

D('Dzikir Harian (1)',[['Istighfar','s','أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ','Astaghfirullaaha wa atuubu ilaih.','Aku memohon ampun kepada Allah dan bertobat kepada-Nya. Nabi SAW beristighfar lebih dari tujuh puluh kali sehari (Bukhari 6307), dan dalam riwayat lain seratus kali (Muslim 2702).','HR. Bukhari no. 6307; HR. Muslim no. 2702'],['Hawqalah: Perbendaharaan Surga','s','لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ','Laa haula wa laa quwwata illaa billaah.','Tiada daya dan kekuatan kecuali dengan pertolongan Allah. Nabi SAW menyebutnya sebagai salah satu perbendaharaan surga. Dzikir ini sejalan dengan nasihat kepada Auf bin Malik agar memperbanyaknya ketika diuji kesempitan.','HR. Bukhari no. 6384; HR. Muslim no. 2704'],['Al-Baqiyatush Shalihat','s','سُبْحَانَ اللَّهِ وَالْحَمْدُ لِلَّهِ وَلَا إِلَهَ إِلَّا اللَّهُ وَاللَّهُ أَكْبَرُ','Subhaanallaah wal-hamdulillaah wa laa ilaaha illallaah wallaahu akbar.','Mahasuci Allah, segala puji bagi Allah, tiada Tuhan selain Allah, Allah Mahabesar. Nabi SAW bersabda bahwa mengucapkannya lebih beliau cintai daripada seluruh yang disinari matahari.','HR. Muslim no. 2695']]);
D('Dzikir dan Doa Harian (2)',[['Doa Petunjuk, Takwa, Kesucian, Kecukupan','s','اللَّهُمَّ إِنِّي أَسْأَلُكَ الْهُدَى وَالتُّقَى وَالْعَفَافَ وَالْغِنَى','Allaahumma innii as-alukal-hudaa wat-tuqaa wal-’afaafa wal-ghinaa.','Ya Allah, aku memohon kepada-Mu petunjuk, ketakwaan, kesucian diri, dan kecukupan. Doa Nabi SAW ini meminta kecukupan (ghina) sejajar dengan takwa, bukan harta sebagai tujuan akhir.','HR. Muslim no. 2721'],['Doa Berlindung dari Susah, Malas, Kikir, dan Utang','s','اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَالْعَجْزِ وَالْكَسَلِ، وَالْبُخْلِ وَالْجُبْنِ، وَضَلَعِ الدَّيْنِ وَغَلَبَةِ الرِّجَالِ','Allaahumma innii a’uudzu bika minal-hammi wal-hazan, wal-’ajzi wal-kasal, wal-bukhli wal-jubn, wa dhala’id-dayni wa ghalabatir-rijaal.','Ya Allah, aku berlindung kepada-Mu dari kesusahan dan kesedihan, lemah dan malas, kikir dan pengecut, lilitan utang dan penindasan orang. Doa ini sangat cocok dibaca pagi dan petang oleh yang sedang terlilit utang.','HR. Bukhari no. 6369'],['Doa Sapu Jagat','q','رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ','Rabbanaa aatinaa fid-dunyaa hasanatan wa fil-aakhirati hasanatan wa qinaa ’adzaaban-naar.','Ya Tuhan kami, berilah kami kebaikan di dunia dan kebaikan di akhirat, dan lindungilah kami dari azab neraka. Inilah doa yang paling sering dibaca Nabi SAW (Bukhari 6389).','QS. Al-Baqarah: 201; HR. Bukhari no. 6389; HR. Muslim no. 2690'],['Doa Ilmu, Rezeki Baik, dan Amal Diterima','d','اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا وَرِزْقًا طَيِّبًا وَعَمَلًا مُتَقَبَّلًا','Allaahumma innii as-aluka ’ilman naafi’an wa rizqan thayyiban wa ’amalan mutaqabbalaa.','Ya Allah, aku memohon kepada-Mu ilmu yang bermanfaat, rezeki yang baik, dan amal yang diterima. Sebagian ulama menilai riwayat ini lemah; jika dibaca, niatkan sebagai doa biasa, bukan sunnah yang pasti dari Nabi SAW.','HR. Ibnu Majah no. 925']]);

R(['Nabi Ibrahim AS: Kekasih Allah yang Meninggalkan Segalanya','q','Jamaah sekalian, mari kita mulai dari gelar yang Allah berikan. Allah berfirman bahwa Dia menjadikan Ibrahim sebagai Khalil, kekasih. Tidak banyak manusia yang menerima gelar seperti itu. Dan sebelum kita mengagumi gelarnya, mari kita tanya: seperti apa jalan yang ia tempuh untuk sampai ke sana? Jawabannya: jalan yang panjang, sunyi, dan penuh pengorbanan.<br><br>Ibrahim ’alaihissalam lahir di tengah kaum yang menyembah patung. Dan yang paling berat, ayahnya sendiri ikut menyembahnya. Allah menceritakan dalam Surat Al-An’am bagaimana Ibrahim membimbing kaumnya berpikir. Suatu malam ia melihat bintang dan berkata, “Inikah Tuhanku?” Ketika bintang itu terbenam, ia berkata, “Aku tidak suka kepada yang terbenam.” Lalu ia melihat bulan terbit, dan setelah bulan terbenam, ia berkata, “Jika Tuhanku tidak memberiku petunjuk, pastilah aku termasuk orang yang sesat.” Kemudian matahari terbit, dan ketika ia pun terbenam, Ibrahim berseru, “Wahai kaumku, sungguh aku berlepas diri dari apa yang kamu persekutukan. Aku menghadapkan wajahku kepada Dzat yang menciptakan langit dan bumi dengan lurus, dan aku bukan termasuk orang musyrik.” Para ulama menjelaskan bahwa ini cara Ibrahim mengajak kaumnya berpikir dengan akal yang sehat.<br><br>Lalu datang ujian terberat: berdakwah kepada ayah. Dengarkan kelembutan adabnya. “Wahai ayahku, mengapa engkau menyembah sesuatu yang tidak mendengar, tidak melihat, dan tidak dapat menolongmu sedikit pun? Wahai ayahku, sungguh telah datang kepadaku ilmu yang tidak datang kepadamu, maka ikutilah aku, niscaya aku tunjukkan jalan yang lurus.” Dan jawaban sang ayah sangat keras: “Bencikah engkau kepada tuhan-tuhanku, wahai Ibrahim? Jika engkau tidak berhenti, pasti akan kurajam engkau, dan tinggalkanlah aku untuk waktu yang lama.” Ibrahim menjawab, “Salamun ’alaika, semoga keselamatan atasmu. Aku akan memohonkan ampun bagimu kepada Tuhanku; sungguh Dia sangat baik kepadaku.”<br><br>Setelah itu, Ibrahim menghancurkan berhala-berhala kaumnya kecuali yang paling besar. Ketika mereka bertanya siapa pelakunya, ia menjawab, “Yang besar ini yang melakukannya, maka tanyakanlah kepada mereka jika mereka dapat berbicara.” Mereka menunduk malu dan berkata, “Engkau tahu mereka tidak dapat berbicara.” Marahlah mereka dan memutuskan membakarnya. Dan inilah titik yang sering kita hafal: Allah berfirman, “Wahai api, jadilah dingin dan keselamatan bagi Ibrahim.” Ibnu Abbas menceritakan, kalimat Ibrahim ketika dilempar ke dalam api adalah: Hasbunallahu wa ni’mal wakil, cukuplah Allah bagi kami dan Dia sebaik-baik pelindung.<br><br>Ibrahim lalu hijrah, meninggalkan negeri dan keluarganya. Ia berkata, “Aku pergi menuju Tuhanku.” Dan dalam keadaan sendirian, ia berdoa, “Ya Tuhanku, anugerahkanlah kepadaku (seorang anak) yang termasuk orang-orang saleh.” Allah memberinya kabar gembira dengan seorang anak yang sangat sabar. Tetapi ketika anak itu mulai bisa menemaninya bekerja, Ibrahim bermimpi menyembelihnya. Ia berkata, “Wahai anakku, sungguh aku bermimpi menyembelihmu, maka pikirkanlah apa pendapatmu.” Anak itu menjawab, “Wahai ayahku, kerjakanlah apa yang diperintahkan kepadamu; insya Allah engkau akan mendapatiku termasuk orang yang sabar.” Ketika keduanya telah berserah diri, Allah memanggil, “Wahai Ibrahim, sungguh engkau telah membenarkan mimpi itu,” dan menggantinya dengan sembelihan yang besar. Dari sinilah asal kurban kita.<br><br>Apa pelajarannya bagi yang sedang sempit? Ibrahim meninggalkan segalanya karena Allah: kaum, ayah, negeri, bahkan anak yang paling dicintai. Dan Allah tidak membiarkannya. Allah menjadikannya ‘umat’ (satu umat) dalam satu pribadi, dan namanya dikenang hingga hari kiamat dalam shalawat kita. Siapa yang meninggalkan sesuatu karena Allah, Allah akan menggantinya dengan yang lebih baik.','QS. Al-An’am: 74–79; QS. Maryam: 41–48; QS. Al-Anbiya’: 51–70; QS. Ash-Shaffat: 97–111; HR. Bukhari no. 4563','حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ<br>رَبِّ هَبْ لِي مِنَ الصَّالِحِينَ','Hasbunallaahu wa ni’mal-wakiil. / Rabbi hab lii minash-shaalihiin.','“Cukuplah Allah bagi kami dan Dia sebaik-baik pelindung.” (QS. Ali Imran: 173) / “Ya Tuhanku, anugerahkanlah kepadaku (seorang anak) yang termasuk orang-orang saleh.” (QS. Ash-Shaffat: 100)']);
R(['Salman Al-Farisi: Mencari Kebenaran Sampai ke Madinah','h','Jamaah sekalian, sekarang kita masuk ke salah satu kisah paling menakjubkan dalam sejarah para sahabat. Kisah ini dituturkan Salman sendiri, dan tercatat dalam Musnad Imam Ahmad, dengan sanad yang dinilai hasan oleh para ulama. Karena riwayatnya panjang, sebagian rincian kecil bisa berbeda antar riwayat, tetapi kerangkanya sama. Dengarkan perlahan, karena setiap bagiannya mengajari kita sesuatu.<br><br>Salman berkata, “Aku seorang Persia dari Isfahan, dari sebuah desa bernama Jayy. Ayahku adalah kepala desa, dan aku adalah orang yang paling ia cintai.” Ia dijaga di rumah, ditugasi menjaga api yang tak boleh padam, karena keluarganya beragama Majusi. Suatu hari ayahnya menyuruhnya ke sebuah tanah, dan di jalan ia melewati sebuah gereja. Ia mendengar suara ibadah mereka, dan ia masuk melihat. Hatinya berkata, “Demi Allah, agama ini lebih baik daripada agama kami.” Ia bertanya, “Dari mana asal agama ini?” “Dari Syam.” Ia pulang terlambat, dan ayahnya marah, lalu ketika ia berkata ingin pergi, ayahnya memasang rantai di kakinya dan memenjarakannya.<br><br>Salman berhasil melepaskan diri dan berangkat ke Syam bersama sebuah rombongan. Di sana ia berguru kepada seorang uskup. Tetapi uskup itu ternyata menyimpan sedekah untuk dirinya sendiri, hingga tujuh peti emas dan perak. Ketika ia wafat, Salman memberi tahu kaumnya, dan mereka menyalib serta melempari jenazah uskup itu dengan batu. Penggantinya adalah seorang yang zuhud, mencintai akhirat, dan rajin beribadah siang malam. Salman mencintainya lebih daripada siapa pun. Ketika ajalnya mendekat, uskup itu menunjukkan orang saleh berikutnya di Mosul, lalu ke Nashibin, lalu ke ’Ammuriyah. Di ’Ammuriyah, Salman bekerja hingga memiliki beberapa sapi dan kambing.<br><br>Menjelang wafat, pendeta terakhir ini berkata, “Aku tidak tahu ada seorang pun di muka bumi yang masih memegang agama yang benar seperti kita. Tetapi telah dekat masa munculnya seorang nabi yang diutus dengan agama Ibrahim. Ia akan keluar dari tanah Arab, dan berhijrah ke tanah di antara dua bukit batu hitam yang ditumbuhi pohon kurma. Tanda-tandanya: ia makan hadiah dan tidak makan sedekah, dan di antara kedua bahunya ada tanda kenabian.”<br><br>Salman lalu bertemu kafilah pedagang Arab dari Kalb, dan menawarkan sapi-sapinya untuk membawanya ke tanah Arab. Tetapi mereka berkhianat dan menjualnya sebagai budak, hingga ia berpindah dari satu tuan ke tuan lain, dan akhirnya sampai di Madinah. Begitu melihat pohon-pohon kurma, hatinya berkata, “Inilah negeri yang digambarkan.”<br><br>Ketika Nabi SAW hijrah, Salman sedang berada di pucuk pohon kurma, bekerja untuk tuannya. Tiba-tiba datang sepupu tuannya berkata bahwa penduduk berkumpul di Quba menyambut seorang laki-laki dari Makkah yang mengaku nabi. Salman gemetar hingga hampir jatuh, lalu turun dan bertanya. Tuannya menamparnya dan membentak agar kembali bekerja. Tetapi sore harinya ia mengambil sedikit makanan dan mendatangi Nabi di Quba. Ia berkata, “Aku dengar engkau orang saleh yang punya sahabat-sahabat asing yang membutuhkan. Ini sedekah dariku.” Nabi menyuruh sahabatnya makan, tetapi beliau tidak makan. Salman berkata dalam hati, “Satu tanda.”<br><br>Kemudian ketika Nabi sudah di Madinah, ia membawa makanan lagi: “Ini hadiah.” Nabi makan dan menyuruh sahabat makan bersamanya. “Dua tanda.” Lalu di pemakaman Baqi’, Salman berputar di belakang Nabi untuk melihat punggungnya. Nabi mengerti, dan menyingkap kain dari bahunya. Salman melihat tanda kenabian itu, lalu menciumnya sambil menangis, dan memeluk Islam. Nabi memintanya menceritakan kisahnya, dan beliau kagum.<br><br>Salman masih seorang budak. Nabi menyuruhnya menebus diri. Tuannya menetapkan tebusan tiga ratus pohon kurma yang harus ia tanam dan hidupkan, ditambah empat puluh uqiyah emas. Nabi bersabda, “Bantulah saudara kalian.” Para sahabat membantu dengan bibit kurma, dan Nabi sendiri menanam dengan tangannya. Tidak ada satu pun yang mati. Lalu Nabi memberinya sebongkah emas dari rampasan. Salman bertanya, “Bagaimana ini cukup?” Nabi bersabda, “Allah akan menyempurnakannya.” Ia menimbangnya, dan tepat empat puluh uqiyah.<br><br>Jamaah, perhatikan. Salman meninggalkan keluarga kaya, rumah, dan kehormatan demi mencari kebenaran. Ia menjadi budak. Tetapi Allah membebaskannya, dan ia menjadi sahabat mulia. Siapa yang mencari kebenaran dengan jujur, Allah akan menuntunnya, walau jalannya jauh. Dan satu hadis dari Salman yang harus kita hafal: Nabi bersabda bahwa Allah malu bila seorang hamba menengadahkan tangan kepada-Nya lalu mengembalikannya dalam keadaan kosong.','HR. Ahmad no. 23737 (hasan); HR. Bukhari no. 3946, 3948; HR. Abu Dawud no. 1488; HR. Tirmidzi no. 3556','إِنَّ رَبَّكُمْ حَيِيٌّ كَرِيمٌ، يَسْتَحْيِي مِنْ عَبْدِهِ إِذَا رَفَعَ يَدَيْهِ إِلَيْهِ أَنْ يَرُدَّهُمَا صِفْرًا خَائِبَتَيْنِ','Inna rabbakum hayiyyun kariim, yastahyii min ’abdihii idzaa rafa’a yadaihi ilaihi an yaruddahumaa shifran khaa-ibatain.','“Sesungguhnya Tuhanmu Maha Pemalu lagi Maha Pemurah. Dia malu apabila seorang hamba mengangkat kedua tangannya kepada-Nya, lalu Dia mengembalikannya dalam keadaan kosong dan kecewa.”']);
R(['Zaid bin Haritsah: Dari Budak Menjadi Kekasih Rasulullah','r','Catatan sebelum membaca: bagian awal kisah ini, yaitu penculikan Zaid dan pertemuannya dengan ayahnya, bersumber dari kitab sirah (Ibnu Ishaq, Ibnu Sa’d, Al-Hakim), dan sanadnya tidak setegas hadis sahih. Karena itu kisah ini kami beri label tersendiri. Adapun bagian tentang Zaid dipanggil ‘putra Muhammad’, namanya disebut dalam Al-Qur’an, dan kisah Mu’tah, bersumber dari Shahih Bukhari.<br><br>Jamaah sekalian, mari kita bayangkan seorang anak kecil dari kabilah Kalb. Namanya Zaid bin Haritsah. Suatu hari ibunya membawanya mengunjungi kerabat, dan di tengah jalan, rombongan berkuda menyerang kampung mereka dan menawan Zaid. Anak itu dibawa ke Makkah dan dijual di pasar sebagai budak. Hakim bin Hizam membelinya untuk bibinya, Khadijah binti Khuwailid. Setelah Khadijah menikah dengan Muhammad, ia menghadiahkan Zaid kepada suaminya.<br><br>Sementara itu, di kampung halaman, ayahnya, Haritsah, menangis siang dan malam mencari anaknya. Hingga suatu musim haji, beberapa orang sekabilah melihat Zaid di Makkah dan menyampaikan kabar. Haritsah dan saudaranya segera berangkat membawa uang tebusan. Mereka menemui Muhammad dan berkata, “Wahai putra Abdul Muththalib, kami datang untuk anak kami. Berbuat baiklah kepada kami dan terimalah tebusannya.”<br><br>Lihat jawaban Nabi: “Panggillah dia, dan berilah dia pilihan. Bila ia memilih kalian, ambillah tanpa tebusan. Dan bila ia memilihku, demi Allah aku tidak akan mengutamakan siapa pun atas orang yang memilihku.” Mereka berkata, “Engkau telah berlaku adil.” Maka dipanggillah Zaid. Ia melihat ayah dan pamannya, tetapi ia berkata, “Aku tidak akan memilih seorang pun di atasmu. Engkau bagiku seperti ayah dan paman.” Ayahnya terkejut, “Celaka engkau, Zaid! Engkau memilih perbudakan di atas ayah, paman, dan keluargamu?” Zaid menjawab, “Ya, aku telah melihat dari orang ini sesuatu yang membuatku tidak akan memilih siapa pun di atasnya.”<br><br>Rasulullah SAW lalu membawanya ke Hijr Ismail dan berseru kepada orang Quraisy, “Saksikanlah bahwa Zaid adalah anakku. Aku mewarisinya dan ia mewarisiku.” Hati Haritsah tenang, dan ia pulang. Sejak itu Zaid dipanggil Zaid bin Muhammad. Dan lihat apa yang diriwayatkan Ibnu Umar dalam Shahih Bukhari: kami tidak memanggil Zaid bin Haritsah kecuali Zaid bin Muhammad, hingga turun ayat, “Panggillah mereka dengan menyebut nama ayah mereka, itulah yang lebih adil di sisi Allah.” Maka Islam meluruskan aturan nasab dan hukum anak angkat, dan Zaid kembali dipanggil bin Haritsah.<br><br>Ada satu kemuliaan yang tak dimiliki sahabat lain: Allah menyebut nama Zaid dalam Al-Qur’an, di Surat Al-Ahzab ayat 37. Ia termasuk yang paling awal masuk Islam, dan Rasulullah SAW sangat mencintainya. Bahkan anaknya, Usamah, dijuluki ‘kekasih putra kekasih Rasulullah’. Dan kemuliaan itu mencapai puncaknya di Mu’tah. Nabi SAW mengumumkan kepada para sahabat di Madinah bahwa Zaid mengambil bendera lalu gugur, kemudian Ja’far, kemudian Abdullah bin Rawahah, sementara mata beliau berlinang. Zaid gugur sebagai panglima.<br><br>Pelajaran bagi kita? Kemuliaan bukan karena nasab, tetapi karena iman dan akhlak. Dari seorang budak yang diculik, Allah mengangkatnya menjadi panglima dan kekasih Rasulullah. Dan ketika kita kehilangan sesuatu, Allah bisa menggantinya dengan yang jauh lebih baik, dengan cara yang tak kita sangka.','HR. Bukhari no. 4782; HR. Bukhari no. 4262; QS. Al-Ahzab: 5, 37; kisah awal dari Sirah Ibnu Ishaq dan Ibnu Sa’d','ادْعُوهُمْ لِآبَائِهِمْ هُوَ أَقْسَطُ عِندَ اللَّهِ','Ud’uuhum li-aabaa-ihim huwa aqsathu ’indallaah.','“Panggillah mereka dengan (memakai) nama bapak-bapak mereka; itulah yang lebih adil di sisi Allah.” (QS. Al-Ahzab: 5)']);
R(['Nabi Isa AS dan Hidangan dari Langit','q','Jamaah sekalian, dalam Surat Al-Ma’idah, Allah menceritakan para pengikut setia Nabi Isa ’alaihissalam, yaitu Hawariyyun. Mereka berkata, “Wahai Isa putra Maryam, sanggupkah Tuhanmu menurunkan hidangan dari langit kepada kami?” Isa menjawab dengan teguran yang halus, “Bertakwalah kepada Allah jika kalian benar-benar orang beriman.” Mereka menjelaskan alasan mereka: “Kami ingin memakannya, agar hati kami tenteram, agar kami yakin bahwa engkau telah berkata benar kepada kami, dan agar kami menjadi saksi atasnya.”<br><br>Maka Isa berdoa. Perhatikan adab doanya: ia memanggil Allah dengan ‘Allahumma Rabbana’, meminta hidangan itu menjadi hari raya dan tanda dari Allah, lalu menutup dengan permohonan yang sangat indah: “Berilah kami rezeki, dan Engkaulah pemberi rezeki yang terbaik.” Allah menjawab, “Sesungguhnya Aku akan menurunkannya kepada kalian. Tetapi barang siapa kafir setelah itu di antara kalian, maka Aku akan mengazabnya dengan azab yang belum pernah Aku timpakan kepada seorang pun di antara umat manusia.”<br><br>Catatan penting: Al-Qur’an tidak menyebut apa isi hidangan itu, sehingga kita tidak menambahkannya dengan cerita yang tak berdalil. Pelajaran: meminta rezeki kepada Allah itu boleh, tetapi permintaan yang disertai nikmat besar juga membawa tanggung jawab besar untuk bersyukur dan tidak ingkar.','QS. Al-Ma’idah: 112–115','اللَّهُمَّ رَبَّنَا أَنزِلْ عَلَيْنَا مَائِدَةً مِّنَ السَّمَاءِ تَكُونُ لَنَا عِيدًا لِّأَوَّلِنَا وَآخِرِنَا وَآيَةً مِّنْكَ ۖ وَارْزُقْنَا وَأَنتَ خَيْرُ الرَّازِقِينَ','Allaahumma rabbanaa anzil ’alainaa maa-idatam minas-samaa-i takuunu lanaa ’iidal li-awwalinaa wa aakhirinaa wa aayatam minka warzuqnaa wa anta khairur-raaziqiin.','“Ya Allah, Tuhan kami, turunkanlah kepada kami hidangan dari langit (agar) hari turunnya menjadi hari raya bagi kami, yaitu bagi orang-orang yang bersama kami dan yang datang setelah kami, dan menjadi tanda dari-Mu. Berilah kami rezeki, dan Engkaulah pemberi rezeki yang terbaik.” (QS. Al-Ma’idah: 114)']);
D('Ayat-Ayat Rezeki Pilihan',[['Rezeki di Tangan Allah','q','وَفِي السَّمَاءِ رِزْقُكُمْ وَمَا تُوعَدُونَ','Wa fis-samaa-i rizqukum wa maa tuu’aduun.','Dan di langit terdapat (sebab-sebab) rezekimu dan terdapat (pula) apa yang dijanjikan kepadamu. (QS. Adz-Dzariyat: 22)','QS. Adz-Dzariyat: 22'],['Allah Sang Pemberi Rezeki','q','إِنَّ اللَّهَ هُوَ الرَّزَّاقُ ذُو الْقُوَّةِ الْمَتِينُ','Innallaaha huwar-razzaaqu dzul-quwwatil-matiin.','Sungguh, Allah, Dialah Pemberi rezeki yang mempunyai kekuatan lagi sangat kokoh. (QS. Adz-Dzariyat: 58)','QS. Adz-Dzariyat: 58'],['Bertebaran Mencari Karunia Allah','q','فَإِذَا قُضِيتِ الصَّلَاةُ فَانتَشِرُوا فِي الْأَرْضِ وَابْتَغُوا مِن فَضْلِ اللَّهِ وَاذْكُرُوا اللَّهَ كَثِيرًا لَّعَلَّكُمْ تُفْلِحُونَ','Fa-idzaa qudhiyatish-shalaatu fantasyiruu fil-ardhi wabtaghuu min fadhlillaahi wadzkurullaaha katsiiral la’allakum tuflihuun.','Apabila salat telah dilaksanakan, maka bertebaranlah kamu di bumi; carilah karunia Allah dan ingatlah Allah banyak-banyak agar kamu beruntung. (QS. Al-Jumu’ah: 10)','QS. Al-Jumu’ah: 10'],['Syukur Menambah Nikmat','q','وَإِذْ تَأَذَّنَ رَبُّكُمْ لَئِن شَكَرْتُمْ لَأَزِيدَنَّكُمْ ۖ وَلَئِن كَفَرْتُمْ إِنَّ عَذَابِي لَشَدِيدٌ','Wa idz ta-adzdzana rabbukum la-in syakartum la-aziidannakum wa la-in kafartum inna ’adzaabii lasyadiid.','Dan (ingatlah) ketika Tuhanmu memaklumkan, “Sungguh, jika kamu bersyukur, niscaya Aku akan menambah (nikmat) kepadamu, tetapi jika kamu mengingkari (nikmat-Ku), maka pasti azab-Ku sangat berat.” (QS. Ibrahim: 7)','QS. Ibrahim: 7'],['Takwa Membuka Keberkahan','q','وَلَوْ أَنَّ أَهْلَ الْقُرَىٰ آمَنُوا وَاتَّقَوْا لَفَتَحْنَا عَلَيْهِم بَرَكَاتٍ مِّنَ السَّمَاءِ وَالْأَرْضِ','Wa lau anna ahlal-quraa aamanuu wattaqau lafatahnaa ’alaihim barakaatim minas-samaa-i wal-ardh.','Dan sekiranya penduduk negeri beriman dan bertakwa, pasti Kami akan melimpahkan kepada mereka berkah dari langit dan bumi. (QS. Al-A’raf: 96; ayat berlanjut tentang mereka yang mendustakan)','QS. Al-A’raf: 96'],['Bersama Kesulitan Ada Kemudahan','q','فَإِنَّ مَعَ الْعُسْرِ يُسْرًا ﴿٥﴾ إِنَّ مَعَ الْعُسْرِ يُسْرًا','Fa-inna ma’al ’usri yusraa. Inna ma’al ’usri yusraa.','Maka sesungguhnya beserta kesulitan ada kemudahan. Sesungguhnya beserta kesulitan ada kemudahan. (QS. Al-Insyirah: 5–6)','QS. Al-Insyirah: 5–6']]);
H+='<section class="pg"><div class="cd"><span class="bd s">Adab Doa Cepat Terkabul</span><h2>Agar Doa Mudah Dikabulkan</h2><table><tr><td><b>1. Makanan halal</b></td><td>Doa orang yang makan, minum, dan berpakaian dari yang haram sulit dikabulkan. (HR. Muslim 1015)</td></tr><tr><td><b>2. Awali pujian & shalawat</b></td><td>Mulai dengan memuji Allah dan bershalawat kepada Nabi SAW. (HR. Tirmidzi 3476; Abu Dawud 1481)</td></tr><tr><td><b>3. Yakin & sungguh-sungguh</b></td><td>Berdoalah dengan yakin akan dikabulkan, dan hati yang tidak lalai. (HR. Tirmidzi 3479, hasan)</td></tr><tr><td><b>4. Jangan tergesa-gesa</b></td><td>Doa dikabulkan selama tidak berkata, “Aku sudah berdoa tapi belum dikabulkan.” (HR. Bukhari 6340; Muslim 2735)</td></tr><tr><td><b>5. Waktu mustajab</b></td><td>Sepertiga malam terakhir (Bukhari 1145), saat sujud (Muslim 482), antara adzan dan iqamah (Abu Dawud 521; Tirmidzi 212), dan ada satu saat di hari Jumat (Bukhari 935; Muslim 852).</td></tr><tr><td><b>6. Doakan orang lain</b></td><td>Doa untuk saudara tanpa sepengetahuannya diaminkan malaikat. (HR. Muslim 2732)</td></tr><tr><td><b>7. Jangan doa dosa</b></td><td>Tidak mendoakan keburukan atau pemutusan silaturahmi. (HR. Muslim 2735)</td></tr></table><div class="nt">Doa pasti dijawab Allah dalam tiga bentuk: dikabulkan segera, disimpan untuk akhirat, atau dihindarkan dari keburukan yang setara. (HR. Ahmad no. 11133)</div><div class="nt"><b>Jujur soal “cepat kaya”:</b> tidak ada amalan sahih yang menjamin cepat kaya, sehingga tidak saya karang. Waspadai tawaran pesugihan, jimat, “amalan berbayar”, atau investasi yang menjanjikan sedekah dilipatgandakan. Itu bukan ajaran Islam dan sering penipuan. Jalan sahihnya: doa + kerja halal + hemat + sedekah + sabar.</div></div></section>';
